- id: day20-c1
  front: SLI、SLO、错误预算分别是什么？
  back: 'SLI：一个比例——好事件/总事件，从用户视角取（如成功请求比例），不用 CPU/磁盘等资源指标。SLO：SLI 的目标值加窗口，如 99.9%/30d，脱离窗口无意义。错误预算 = 100% − SLO，即允许「不达标」的量。'
- id: day20-c2
  front: SLO 99.9%、窗口 30 天，允许累计不可用多久？每多一个 9 意味着什么？
  back: '30 天 = 720 小时；错误预算 0.1% → 0.001 × 720h = 0.72h = 43.2 分钟。每多一个 9，允许的不可用时长砍掉一个数量级（99.99% → 4.32 分钟），这就是「每个 9 贵 10 倍」的来历。'
- id: day20-c3
  front: burn rate 怎么定义？burn rate = 1 和 = 14.4 分别是什么意思？
  back: 'burn_rate = 当前错误率 / (1 − SLO)。= 1 表示按当前速度窗口结束时恰好烧完预算；> 1 会提前烧完。在 99.9%（预算率 0.001）下，14.4 表示 1 小时烧掉 30 天预算的 2%（14.4 × 1h/720h）。'
- id: day20-c4
  front: 为什么告警要用「多窗口、多燃烧率」？三档阈值是多少？
  back: '单窗口要么太钝要么太吵；长窗判断「是不是真问题」，短窗保证「恢复快也灭得快」，两窗同时超阈值才触发。Google SRE 三档：critical 1h/5m burn rate 14.4（1h 烧 2%）；critical 6h/30m burn rate 6（6h 烧 5%）；ticket 3d/6h burn rate 1（3d 烧 10%）。'
- id: day20-c5
  front: 把 OTel 接进交付链路，最关键的一条硬要求是什么？
  back: service.version 必须是制品的不可变版本（digest 或 commit SHA，不能是 latest），且 OTel 接在发布链路里而非发布之后。这样版本一换，SLO 曲线、错误率、回滚判定就自动按版本切分，看板能和「哪次发布/回滚」对上号。
- id: day20-c6
  front: 怎么把「可不可以发」变成一个自动门禁？
  back: '在流水线里加一个查询 Prometheus 的 job：算出当前 burn rate，超过阈值就让 job 失败。通常两级：burn_rate > 1 阻断部署；0.5 < burn_rate ≤ 1 要求人工审批。用 recording rule 预计算 SLI 保证口径一致。'
- id: day20-c7
  front: 告警分级的判据是什么？治理噪声有哪些手段？
  back: '判据只有一个：用户是否正在受损/是否在烧 SLO 预算，而不是「曲线难看」。级别：page（立刻叫醒，需 runbook）、ticket（工作时间处理）、log（只入库）。治理手段：分组、抑制（大故障压掉次级告警）、静默、for 延时、用 SLO 告警替代阈值告警。跟踪每周 page 数与 actionable 比例。'
- id: day20-c8
  front: 不追责复盘的产出标准是什么？为什么度量 MTTR 比 MTBF 更可行动？
  back: 'Blameless：系统会失败，人不会故意失败，要找系统为何让错误成为可能。复盘必须产出有 owner、有截止日期、进入统一 issue 追踪的行动项，否则等于没复盘。MTTR（恢复时间）比 MTBF（故障间隔）更可行动，因为你无法阻止所有故障，但能决定恢复多快。'
