- id: day20-q1
  q: 给一个 HTTP 服务定 SLI，为什么不该用「CPU 使用率」或「磁盘占用」？
  a: '因为 SLI 要从用户视角衡量「用户现在能不能正常用」：好事件/总事件的比例（成功请求比例、duration < 阈值的请求比例）。CPU、磁盘是资源指标，可能很高但用户毫无感知，也可能很低但服务已不可用。用资源指标做 SLI，会既误报又漏报，且无法回答「还剩多少错误预算」。'
- id: day20-q2
  q: 一个服务 SLO 为 99.9%/30d。某小时错误率 1.44%，burn rate 是多少？这 1 小时消耗了预算的百分之几？
  a: 'burn rate = 错误率 /(1−SLO) = 1.44% / 0.1% = 14.4。1 小时消耗预算比例 = burn_rate × 1h/720h = 14.4/720 = 2%。正好命中 critical 阈值（14.4，含义就是 1h 烧 2%），会触发 page。'
- id: day20-q3
  q: 为什么 burn rate 告警要用「长窗 + 短窗」两个窗口同时超阈值才触发，而不是单窗口？
  a: '单一窗口两难：窗口太长对突发不敏感（用户已受损却迟迟不报），窗口太短又会被瞬时抖动反复触发（告警疲劳）。长窗负责判断「这是真的在快速烧预算」，短窗负责「一旦恢复立刻解除」。两窗都超阈值才触发，兼顾灵敏度与稳定性。'
- id: day20-q4
  q: 团队抱怨「告警太多没人看」，从 SRE 视角怎么治理？
  a: '先按判据分级：只有用户受损/在烧 SLO 预算才 page，其余降为 ticket 或 log；再上治理手段——分组、抑制（大故障压掉次级告警）、静默（计划内维护）、for 延时躲抖动、用 SLO 告警替代一堆阈值告警；最后用数据验证：每周 page 数、被静默比例、触发后真正采取行动的比例。比例低于约 50% 就说明还在制造疲劳，继续砍。'
