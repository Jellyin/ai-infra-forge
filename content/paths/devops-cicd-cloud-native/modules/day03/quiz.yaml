- id: day03-q1
  q: 为什么说「缓存命中」不等于「输入一致」？举一个会造成假命中的 key 设计。
  a: '命中只说明 key 算出来一样，不说明 key 覆盖了所有影响产物的输入。最典型的是常量 key（如 key: deps）：无论依赖怎么变，key 都不变，于是永远命中同一份旧内容，构建在过期依赖上进行且完全不报错。另一种是只含锁文件哈希却不含工具链版本——Node 主版本升级后锁文件未变，原生模块却是旧架构的。正确的 key 要覆盖「所有会改变产物的输入」，并且必须让空缓存在语义上等同于「第一次构建」。'
- id: day03-q2
  q: BuildKit 的 --cache-from 与 GitLab 的 cache:key 在安全性上的根本区别是什么？
  a: 'BuildKit 的层缓存是内容寻址的：--cache-from 只是给出导入候选，是否命中由内容摘要比对决定，所以即使 ref 指向一个无关或过期的 cache image，也不会复用错误的层，最多是全部 miss（慢，但不危险）。GitLab 的 cache:key 是按键取值：它信任「key 相同就意味着内容可复用」，因此 key 的设计直接决定正确性，key 不含内容就会拿到过期内容。这决定了二者的防御重点不同——前者关注后端可用性与跨平台分流，后者关注 key 的构成与写入权限。'
- id: day03-q3
  q: 多架构下为什么必须按平台分键？用 runner 架构分键会在什么场景失效？
  a: '因为 amd64 与 arm64 的产物本质不同（node-gyp 原生模块、Python wheel、cgo、Rust 目标三元组、基础镜像层都不通用），共享缓存会让一个平台的产物被另一个平台复用，而且症状通常在运行期才出现（链接失败、段错误），构建期看起来是绿的。用 runner 架构分键（如 CI_RUNNER_EXECUTABLE_ARCH）只在「每个平台各自跑在对应架构的 runner 上」时成立；一旦用 QEMU / binfmt 在同一台 amd64 runner 上交叉构建 arm64，runner 架构恒为 amd64，两个平台的 job 就落到同一个 key 上。必须用目标平台：buildx 的 TARGETARCH / TARGETPLATFORM，或自定义变量。'
- id: day03-q4
  q: 什么情况下你会主动禁用缓存？
  a: '四类：① 对外发布的可复现构建验证，必须从干净状态重建才能声称「可复现」；② 安全扫描基线，要扫真实依赖而不是缓存里的快照；③ 多个 runner 并发写同一个 key 导致互相覆盖时——此时要么分键要么串行，不能靠「多写几次」蒙；④ 依赖源被投毒后的紧急处置，用 --no-cache / --pull 从可信源重建。共同点是：这些场景里缓存带来的加速收益，远小于它带来的「结果不可信」的代价。'
