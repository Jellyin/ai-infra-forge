id: day21
title: 生产就绪与结课演练
goal: 把二十天的东西串成一条能落地的端到端流程
order: 21
track: 轨道 5 · 平台化与生产就绪
read: 18
lab: 45
concepts:
  - 上线检查单：从清单化到可自动校验
  - 容量与成本：容量规划如何进入发布流程
  - 回滚演练与故障注入：把回滚练成肌肉记忆
  - 端到端图：提交 → 检查/测试 → 多架构制品与签名 → 门禁 → GitOps → 渐进式发布 → 观测
  - 把「这次发布」变成「下次可复用」的资产
  - 差距清单：你现在的流水线与目标的差距与补齐顺序
checklist:
  - 能写出一份可以自动校验的上线检查单
  - 能画出并讲清端到端交付链路
  - 能设计一次回滚演练并定义成功标准
  - 能给出自己项目的差距清单与补齐顺序
  - 能解释这套流程里最脆弱的一环与加固方式
