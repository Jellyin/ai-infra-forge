- id: day21-q1
  q: 一张靠人勾选的上线检查单，为什么靠不住？怎么改造？
  a: '因为它不会失败——勾不勾全凭自觉，漏项不会中断发布。改造：把检查项分类，能自动校验的（签名验签、镜像 digest 与清单一致、错误预算充足）做成会 fail 的流水线 job；能自动告警的接进观测；勾选表只保留真正需要人判断的少数项（如数据迁移可逆性、runbook 就位）。'
- id: day21-q2
  q: 端到端链路里每一段都有机器可验证的契约，为什么回滚仍是最脆弱的一环？
  a: '因为回滚是唯一「没人真的点过」的环节：其余环节每次发布都在跑，回滚只在出事时才用，用得最少、坏得最隐。它同时依赖「观测信号可信」这一前提（service.version 打错或口径不一致会让系统自信地做错决定），并跨越最多系统边界（部署系统、Git、制品库、观测、凭证），任何长期凭证过期都会在最需要时暴露。'
- id: day21-q3
  q: 面对最脆弱的一环（回滚 + 观测可信），加固的先后顺序是什么？为什么不能跳步？
  a: '顺序：先定期回滚演练（练成肌肉记忆、发现回滚路径真实存在的障碍）→ 再让观测信号可信（service.version 对齐发布、SLI 口径统一）→ 最后才做自动回滚门禁。不能跳步是因为：若回滚路径本身不可用、或指标不可信，自动化只会把错误决策执行得更快——即「自信地做错」被自动化。'
- id: day21-q4
  q: 给你自己项目排差距清单时，为什么「可验证性」要排在「便利性」前面？
  a: '因为可验证性（制品不可变与签名验签、供应链门禁、假绿灯清零、回滚演练常态化）是信任根。没有它，渐进式发布、自助门户、模板组件化这些便利能力都建立在一个不可信的地基上——自动化只是让你在更快的速度上犯错。所以先补签名/门禁/测试可信，再补自动化与自助。'
