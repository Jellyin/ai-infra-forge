- id: day21-c1
  front: 上线检查单最大的问题是什么？该怎么改？
  back: '最大的问题是它不会失败——一张靠人勾选的表等于靠自觉。改法：把检查项拆成三类——能自动校验的（签名验签、digest 一致、错误预算充足）、能自动告警的、只能人判断的。凡机器能判定的就做成会 fail 的 job，勾选表只留真正需要人判断的少数几项。'
- id: day21-c2
  front: 容量和成本应该怎么进入发布流程？
  back: '作为发布的输入而非季度报告。容量：声明 requests/limits、确认 HPA 目标与副本下限、留 headroom，门禁判据是部署后预估 p95 是否逼近饱和阈值。成本：把「每次请求成本」「每月单副本成本」做成随服务走的指标、按标签分摊，让「这次发布会不会让单位成本翻倍」在发布前可见。'
- id: day21-c3
  front: 回滚演练的成功标准是什么？
  back: '四条缺一不可：① 从「决定回滚」到「用户恢复」的时长有上限（如 ≤5 分钟）；② 数据一致性成立（迁移是否可逆）；③ 告警/错误预算曲线确实回落；④ 结论进入 runbook。没演练过的回滚等于没有回滚。'
- id: day21-c4
  front: 端到端交付链路有哪六段？
  back: '提交 → [1] 检查/测试（分层）→ [2] 多架构制品+签名（SBOM/cosign）→ [3] 供应链门禁（漏洞/策略/准入/验签）→ [4] GitOps（ArgoCD 同步，Git 是唯一事实源）→ [5] 渐进式发布（Argo Rollouts canary，指标判定）→ [6] 观测与回滚（SLO/burn rate、自动或人工回滚）。'
- id: day21-c5
  front: 这张端到端图里最脆弱的一环通常是哪个？为什么？
  back: '通常是 [6] 的回滚路径及其依赖的观测信号可信度。三个反直觉理由：① [1]–[5] 每次发布都被反复执行，回滚只在出事时才用，用得最少、坏得最隐；② 它依赖「指标是对的」，若 service.version 打错或口径不一致，系统会自信地做错决定；③ 它跨越最多系统边界（部署系统/Git/制品库/观测/凭证），任何长期凭证过期都会在最需要时暴露。'
- id: day21-c6
  front: 针对最脆弱的一环，加固顺序是什么？
  back: '先用定期回滚演练把它变成肌肉记忆，再让观测信号可信（service.version 对齐发布、SLI 口径统一），最后才把回滚做成自动门禁。跳过前两步直接自动化，只会把「自信地做错」自动化。'
- id: day21-c7
  front: 怎么判断「这次发布」是否沉淀成了「可复用资产」？
  back: '判据：下一个团队照你留下的东西，能否在半天内复现同一条链路？具体包括把流水线抽成带版本的 component、把检查单里可自动的项变成会 fail 的 job、把 runbook 与演练记录写进仓库、把 SLO 与看板代码化、把复盘行动项进入统一 issue 追踪。做不到就只是一次发布。'
- id: day21-c8
  front: 给自己项目排差距清单时，补齐顺序的原则是什么？
  back: '先补信任根，再补便利：可验证性（制品不可变+签名、供应链门禁、「假绿灯」清零、回滚演练常态化）优先于便利性（错误预算门禁、渐进式发布、模板组件化、自助门户）。因为可验证性是信任根，没有它，后面的自动化只是在更快的速度上犯错。'
