- id: day01-q1
  q: 流水线显示全绿，你能据此宣布「这次发布是安全的」吗？为什么？
  a: 不能。绿灯只说明「已运行的 job 没失败」，不说明该跑的都跑了（幽灵 job）、跑的是否本次代码（缓存假命中）、测的有没有用例（零用例通过）、部署的是否同一份制品（直连 kubectl 无制品关联）。要能宣布安全，需要回答「绿灯覆盖了什么」。
- id: day01-q2
  q: job 长时间停在 pending，先查什么？这和「job 跑得慢」有什么区别？
  a: pending 是 runner 侧的资源问题——没有可用 runner 认领该 job，查 tag 是否匹配、runner 是否在线、并发上限是否打满、是否被其他项目挤占。这与 job 内部执行慢完全不同，优化方向一个是加资源/调并发，一个是优化脚本与缓存。
- id: day01-q3
  q: 为什么说「needs 依赖写错」比「job 失败」更危险？
  a: job 失败会立刻变红、有人处理；needs 指向错误或不存在的依赖，往往表现为静默跳过或提前启动，流水线仍是绿的，但结果已不可信。它不会触发任何告警，属于典型的「假绿灯」。
- id: day01-q4
  q: 三种「不发红但等于没测」的写法，以及统一的排查方法？
  a: 'allow_failure: true、when: manual 没人点、测试选择器匹配 0 用例。统一排查：不看「绿不绿」，看该跑的 job 数目对不对、用时是否合理（是否秒过）、用例数是否为 0。'
