id: day05
title: 流水线自身的可观测、成本与治理
goal: 流水线也是生产系统：它慢、它贵、它会被滥用
order: 5
track: 轨道 1 · 流水线主干与 CI 内嵌能力
read: 18
lab: 25
concepts:
  - 关键指标：排队时长、执行时长、失败率、重试率、缓存命中率
  - artifact 体积与保留策略：隐性的存储账单
  - runner 利用率与并发治理（挤兑与饥饿）
  - Schedules、手动 job、Review Apps 的适用场景与陷阱
  - CI 成本归因：按项目/分支/用户
  - 把「流水线慢」定位到具体阶段的方法
checklist:
  - 能搭出一张流水线健康看板并说出告警阈值
  - 能定位一条流水线变慢的具体原因（排队还是执行）
  - 能设计 artifact 保留策略控制存储成本
  - 能解释 runner 饥饿的成因与缓解手段
  - 能给出 Review Apps 的自动回收方案
