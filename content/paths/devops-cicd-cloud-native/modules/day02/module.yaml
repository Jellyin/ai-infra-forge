id: day02
title: 快速反馈链：检查与测试分层
goal: 把反馈时间压到最短，同时不牺牲可信度
order: 2
track: 轨道 1 · 流水线主干与 CI 内嵌能力
read: 20
lab: 30
concepts:
  - 分层：lint/格式化 → 类型 → 单测 → 集成 → 契约 → e2e
  - 为什么快检查必须先跑且必须阻断
  - 并行化：needs、parallel:matrix、Actions matrix 对照
  - 只跑受影响的部分（monorepo 按需触发）
  - flake 测试治理：重试是止疼药不是解药
  - 覆盖率作为门禁的正确用法与误用
checklist:
  - 能设计一条分层反馈链并给每层定时间预算
  - 能用 matrix 展开测试矩阵并说明资源代价
  - 能定位一个 flake 用例并给出根治方案
  - 能解释覆盖率门禁为何容易被绕过以及怎么设才有效
  - 能说出「只跑受影响部分」在你项目里的判定依据
