- id: day11-q1
  q: 为什么说「staging 存在的唯一理由是与 prod 同构」？
  a: 因为 staging 的用途是「发布前的可信代理」——只有在配置、依赖拓扑、数据形态都与 prod 接近时，它跑通才意味着 prod 大概率跑通。一旦它与 prod 不一致（不同镜像、不同中间件版本、不同的数据约束），它的绿灯只是虚假信心，甚至比没有 staging 更危险。
- id: day11-q2
  q: 受保护分支和受保护环境分别保护什么入口？只配其中一个会怎样？
  a: 受保护分支保护代码入口（谁能 push/合并），受保护环境保护部署入口（谁能部署、谁能批准）。只保护分支，则任何有部署权限的人仍可直接上 prod；只保护环境，则代码可以绕过评审进主干。两个入口都要收，缺一留缺口。
- id: day11-q3
  q: 回滚窗口为什么会关闭？举出三种关闭原因。
  a: '窗口因「不可逆的副作用已经发生」而关闭，例如：① 数据库破坏性 schema 变更已执行（旧代码读不了新结构）；② 新逻辑已写入只有新版本能理解的数据；③ 对外 API/契约已发布且已有外部消费者，或已发出的消息/事件无法收回。窗口关闭后只能前滚修复，不能回退。'
- id: day11-q4
  q: 一个「删除数据库一列」的变更，怎么拆成可回滚的步骤？
  a: '按 expand / contract 拆：① 先加新列并保持向后兼容（旧代码照常）；② 双写/回填数据，新旧代码都能读；③ 切换读路径到新列并观察；④ 确认无误后才删旧列。每步都能单独回滚，且迁移要幂等、先在 staging 验证。注意 ArgoCD 的 rollback 只能退回声明，退不了数据，所以退路必须在变更前就准备好。'
