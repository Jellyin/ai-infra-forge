id: day16
title: 训练任务的 CI/CD 特殊性
goal: 为什么训练不能照搬 Web 的流水线
order: 16
track: 轨道 4 · AI 训练与推理交付
read: 22
lab: 30
concepts:
  - 长时作业、GPU 稀缺、抢占与重试语义
  - 可复现性三要素：代码 / 数据 / 超参的版本化
  - checkpoint 与断点续训的工程含义
  - 数据依赖：数据集版本、缓存、以及对流水线的约束
  - 训练镜像即环境：为什么不用 conda 装
  - 「跑成功了」和「结果可复现」是两件事
checklist:
  - 能列出训练流水线与 Web 流水线的五点本质差异
  - 能设计一套实验可追溯的版本化方案
  - 能说明 checkpoint 策略与容错的关系
  - 能解释为什么训练镜像要固定到 digest
  - 能指出一次「结果不可复现」的最可能原因
