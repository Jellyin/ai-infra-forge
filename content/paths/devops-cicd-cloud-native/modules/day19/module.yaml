id: day19
title: 平台工程与自助化
goal: 让 20 个团队不必各写一套流水线
order: 19
track: 轨道 5 · 平台化与生产就绪
read: 20
lab: 30
concepts:
  - CI Components / 可复用 workflow：模板的正确抽象粒度
  - golden path：默认即最佳实践
  - 参数化与版本化模板：模板自己也要发版
  - 内部开发者门户（Backstage 等）解决什么问题
  - 平台团队的 SLO：「流水线可用性」也是 SLO
  - 反模式：模板过度抽象与「改配置要改平台」
checklist:
  - 能把一条流水线抽象成可复用模板并版本化
  - 能说清哪些东西该进模板、哪些必须留给团队
  - 能为平台自身定义 SLO
  - 能设计模板的升级与弃用策略
  - 能识别过度抽象的信号
