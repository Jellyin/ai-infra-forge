- id: day19-q1
  q: 平台工程说「不是把 20 条流水线统一成 1 条」，那它到底要做什么？举一个判据。
  a: 不是追求形式上统一，而是把最佳实践变成默认值（golden path），让团队走现成那条路就自动是对的。判据是新团队从 0 到第一次绿色部署要多久、要写几行 YAML——越短越少越真实。统一只是结果，不是目标。
- id: day19-q2
  q: 一个业务团队想要一个「只给他们用」的构建开关，作为平台方该怎么处理？
  a: 拒绝把它做成组件的 inputs。只有一个消费者的输入是伪差异、是分叉而不是参数。让该团队从 golden path 分叉出自己的模板，并自己承担分叉的维护成本。每多一个 inputs 都是平台要长期维护的兼容承诺，不能被个例稀释。
- id: day19-q3
  q: 平台升级了一次组件模板，结果所有仓库同时红——根因是什么？怎么系统性避免？
  a: 根因是业务仓库引用了可变分支（如 @main），没有版本固定，平台一次提交即可造成全公司爆炸半径。避免方法：组件走语义化版本、调用方按 tag 固定、破坏性变更走 major 并配套弃用四步、同时维护 N-1/N-2 供排期升级。
- id: day19-q4
  q: 把「流水线可用性」当 SLO 时，SLI 里为什么必须排除「用户代码错误」导致的失败？
  a: 因为用户的代码本来就编译不过，这不是平台的责任，算进成功率会把平台质量淹没在噪声里、指标失去行动力。SLI 应只统计平台侧可控的失败（如 runner 故障、组件 bug），这样达到目标时才有意义，错误预算烧尽也才能正确触发「冻结平台自身变更」的动作。
