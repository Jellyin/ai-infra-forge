- id: day08-q1
  q: 同一个镜像 tag「1.4.0」，为什么可能在某天悄悄变成了另一个镜像？这会造成什么后果？
  a: 'tag 是可被覆盖的指针。任何人（或一条错误的流水线）重新 push 同名 tag，它就从镜像 A 静默指向镜像 B，不会报错、不会告警。后果是所有引用该 tag 的部署清单下次拉取时都拿到新镜像——一次「没改过任何配置」的发布，实际换了制品；若新镜像未被测试，就是把未验证的二进制推上了生产。'
- id: day08-q2
  q: 你的安全评审发现 prod 镜像的 digest 与 CI 为该 commit 产出的 digest 不一致。这意味着什么？如何防止？
  a: '意味着 prod 跑的不是 CI 构建并测试过的制品——很可能是「为生产重新构建了一次」，基础镜像/依赖/构建环境的变化都会让这个二进制从未被验证过。防法：prod 仓库对 CI 只给搬运权限不给构建推送；晋升脚本断言两端 digest 相等；部署清单钉死 digest；集群准入校验来源与签名。'
- id: day08-q3
  q: 一个 tag 背后是多架构的 manifest list。晋升与部署引用时该用哪个 digest，为什么？
  a: '用顶层 index（manifest list）的 digest。它是「这张清单」的内容寻址身份，指向全部平台的集合；部署清单写 image@sha256:<index-digest>，节点按自身架构从 index 里选对平台。若误用某个单架构 digest，另一架构的节点会拿到不合适或缺失的层。搬运时用 skopeo copy --all（或 crane copy）保留全部平台。'
- id: day08-q4
  q: 结合保留策略，说说镜像仓库为什么必须治理容量，以及至少两条具体动作。
  a: '每个 commit 一个 tag、每个 tag 背着一层层依赖，仓库会无声膨胀直至吃光存储额度，且没人清理的仓库一定会烂。动作：① 只保留有意义 tag——prod 的 semver 永久保留，dev 的 branch-sha 保留最近 N 个或超 X 天删除；② 用平台清理策略（GitLab cleanup policy，GHCR 自建），并可用 regctl tag rm 按 tag 删除；③ 把存储用量、tag 数、最老 tag 年龄纳入看板监控。'
