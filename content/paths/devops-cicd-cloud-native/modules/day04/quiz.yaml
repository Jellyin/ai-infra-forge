- id: day04-q1
  q: 六类扫描（SAST/SCA/Secret Detection/容器/License/DAST）各自能发现什么、发现不了什么？
  a: 'SAST 发现源码里的注入、危险 API、硬编码凭证等模式，发现不了运行期才成立的漏洞与跨服务逻辑缺陷（误报也高）；SCA 发现依赖的已知 CVE 与可升级版本，发现不了 0-day、库被误用与供应链投毒；Secret Detection 发现凭证模式，发现不了非标准自研密钥，且命中即已泄露、删文件不等于止血；容器扫描发现 OS 包与语言依赖 CVE，发现不了宿主/编排配置与运行期行为，且只覆盖被扫的架构；License 发现许可证类型，发现不了许可证实际如何被使用；DAST 在运行时发现注入/认证/CORS 类问题，发现不了需要业务上下文触发的逻辑漏洞，且最慢最贵。'
- id: day04-q2
  q: 为什么容器镜像扫描必须按多架构分别做？只扫 amd64 会怎样？
  a: '一份 manifest list 下 amd64 与 arm64 是两组不同的层、不同的 SBOM、不同的 CVE 结果，而扫描器一次只解析一个平台。只扫 amd64，等于对 arm64 生产镜像零覆盖——你以为覆盖了全部，实际覆盖率是零。正确做法是两个架构各自构建、各自扫描，SBOM 与扫描报告都覆盖两个架构。这是最隐蔽的一种覆盖率谎言，比不扫更容易骗过自己。'
- id: day04-q3
  q: 分级阻断该怎么设计？哪些硬拦、哪些要求审批、哪些不阻断？
  a: '硬拦：Secret Detection（凭证入历史即泄露，只能轮换止血）、SCA 与 SAST 的 Critical 且为本次新增。要求审批：High 的新增项，由人逐条确认是否可利用。只报告：Medium/Low。不阻断适用于高成本、高误报、需人判断的检查（DAST、覆盖率趋势、License 提示），但必须显式声明它不阻断，否则就是冒充门禁。同时要靠基线只看增量，否则老项目第一天全红，会逼出「全员静音」。'
- id: day04-q4
  q: 怎么防止「安全检查被全员静音」？
  a: '先做基线冻结存量，让门禁只对本次新增负责；首日只上高信噪比的三件套（Secret Detection、SCA Critical、容器 Critical），其余先只报告；每条 allowlist 豁免带到期时间与责任人，到期提醒、定期回收；定期复核 Top 误报并调规则而不是加豁免；用「新增=修复」的收敛速度做度量，而不是告警总数。核心是：一个被静音的检查保护不了任何人，宁可少上几个，也不要上一个谁也不看的。'
