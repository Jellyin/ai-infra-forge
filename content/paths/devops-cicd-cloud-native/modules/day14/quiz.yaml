- id: day14-q1
  q: 什么样的场景你会选蓝绿而不是金丝雀？
  a: 需要「要么全切要么不切」的原子切换时，例如有状态迁移、或新旧版本无法长期按比例共存（协议不兼容）。金丝雀依赖新旧版本各跑一份，两者不能共存时「部分流量」就不成立。蓝绿代价是双倍资源，换的是切换原子性。
- id: day14-q2
  q: 金丝雀 analysis 判定失败并触发回滚，是「谁」把流量切回稳定版的？CI 参与了吗？
  a: '是 Argo Rollouts controller 执行的回滚——把流量导回稳定版并标记 Degraded。判定依据来自 AnalysisTemplate 的 Prometheus 查询与 successCondition/failureLimit。CI 只构建镜像、更新 GitOps 仓库的 image tag，不判定也不回滚。'
- id: day14-q3
  q: 为什么金丝雀刚放量时容易误判？说两条防护手段。
  a: 新副本冷启动时连接池未预热、JIT 未编译，头几十秒延迟天然偏高；此时流量小、分母小，偶发错误被放大。防护：① setWeight 后加 pause 让判定晚于冷启动；② 给足 failureLimit 过滤单次尖峰，并要求样本量达阈值才判定。
- id: day14-q4
  q: 给已有生产数据的表加字段并让新代码使用它，为什么不能「改列 + 发新代码」一次做完？
  a: 因为这样每次发布都不可回滚：新代码依赖新列、而列变更不可逆，一旦要回滚，旧代码面对的是已被改动的结构。正解是 expand/contract 两阶段——先加可空新列、双写回填，最后等所有实例升级完才删旧列；在此之前任何发布都能安全回滚。
