- id: day09-q1
  q: 有人回答「我们给镜像做了签名，所以供应链安全了」。这个结论缺了什么？
  a: '签名只回答「完整性与身份」——制品没被篡改、签名者是谁。它回答不了「制品里有什么组件」（要 SBOM）和「制品是怎么、由哪条流水线构建的」（要 provenance）。而且签名只有在准入端被强制校验才有意义：有签名但没人验，等于没签。完整链路是 SBOM + provenance + 签名 + 准入端强制验签。'
- id: day09-q2
  q: keyless 签名没有长期私钥，是不是就没有密钥管理负担了？
  a: '不是，负担从「密钥」转到了「身份与信任根」。要治理 OIDC subject 规则（限制到具体分支/环境，避免 repo:* 通配）、Fulcio/Rekor 的信任根分发与更新、以及准入策略里配置的 issuer/roots 的一致性。这些配错会集体验签失败——是需要演练的故障面。'
- id: day09-q3
  q: 一个多架构镜像按 tag 拉取时验签失败，但构建时明明「签过名」了，最可能的原因是什么？
  a: '很可能是只对单架构 manifest 签了名，而消费者按 tag 解析到的是 index（manifest list）digest，准入端校验 index 时找不到对应签名。多架构应签 index digest 并验 index digest。也可能命中其他原因：issuer/identity 配错、证书过期、信任根不一致。'
- id: day09-q4
  q: 你的项目该怎么定 SLSA 目标级别？给出判断依据。
  a: '看威胁模型，而不是看「等级越高越好」。内部工具、构建环境可信，托管平台自动产出的 L2 已足够；制品流向外部消费者或构建环境有共享组件时再考虑 L3。核心前提：L3 要求构建平台加固到用户构建步骤碰不到签名密钥——若用一个 job 脚本能碰到密钥的自托管 runner，那是纸面 L3，不如老实做 L2。'
