- id: day21-c1
  front: 拓扑感知调度为什么能差 2-5 倍性能？
  back: 同一 8 卡任务：调度到同机（NVLink 域 300-900GB/s）vs 散到两机（跨机走 IB≤50GB/s 且多一跳）——同一代码纯调度位置决定 NCCL 速度。检查法：nvidia-smi topo -m + NCCL_DEBUG 的 topo 日志。
- id: day21-c2
  front: 碎片率怎么算？300 空闲卡只能凑 4 整机（32卡）的碎片率？
  back: 碎片率=1-最大可分配整机卡数/空闲总卡数=1-32/300≈89%。268 张「空闲」卡逻辑不可用。治理：整机池/共享池分离、装箱紧凑、descheduler 重排。
- id: day21-c3
  front: 训练调度的装箱策略与 Web 服务为什么相反？
  back: Web 习惯 spreading（分散容灾）；训练要 binpacking（紧凑）：① 同任务多卡要近（拓扑/通信快）② 腾出的整机是完整资源给下一个大任务。老运维「分散=好」的肌肉记忆在训练上是错的。
- id: day21-c4
  front: 平台团队的调度打分器扩展打什么分？
  back: 亲和性+拓扑代价+碎片代价的加权和——「怎么算一张卡对某任务的分」。聊到这层=设计过调度扩展而非仅用过 Volcano。
