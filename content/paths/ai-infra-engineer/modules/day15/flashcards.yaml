- id: day15-c1
  front: checkpoint 的三要素？缺优化器状态会怎样？
  back: 模型权重+优化器状态（Adam 动量，体积是权重2倍）+数据位置/步数。缺优化器状态=冷启动，续训 loss 跳变几百步。
- id: day15-c2
  front: "70B 模型完整 checkpoint 多大？为什么？"
  back: ≈700GB。权重 140GB + 优化器状态 560GB（Adam 一二阶动量是权重的 8 字节/参数）。这就是 checkpoint 存储吞吐是平台级问题的原因。
- id: day15-c3
  front: Meta Llama-3 训练的故障频率数据？
  back: 54 天 419 次意外中断（平均~3小时一次），GPU 硬件占 58%、网络 11%。容错不是会不会坏，是怎么最快恢复。
- id: day15-c4
  front: 分层异步保存怎么把阻塞压到秒级？
  back: 显存→CPU 内存暂存（训练不阻塞）→本地 NVMe→后台传对象存储。同步保存 700GB 会打断训练分钟级；异步只阻塞暂存那几秒。
- id: day15-c5
  front: 续训后 loss 跳变说明什么？
  back: 优化器状态没存对（或加载了错误路径）——Adam 动量丢失等于冷启动。验证续训正确的标准：前10步 loss 与中断前连续。
- id: day15-c6
  front: 为什么 checkpoint 不能只留最新一份？
  back: 最后一份可能恰好在保存中途损坏（保存也是故障窗口）。标准做法：保留最近 N 份 + 异步完整性校验，损坏则回退前一份。
