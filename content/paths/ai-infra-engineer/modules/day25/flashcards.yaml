- id: day25-c1
  front: 推理服务的容量水位四档？
  back: <60% 健康；60-80% 黄色启动评估；>80% 红色（排队/SLO 恶化发生中）；>95% 持续=事故级限流保命。训练侧容量单位是卡时需求/供给（roadmap→采购单）。
- id: day25-c2
  front: 均值 40% 但峰值 92%，买不买卡的正确姿势？
  back: 报 P95/P99 水位而非均值（CFO 看均值用户看峰值是经典分歧），对比「为 P99 的 8% 时间买整机 vs 混部/弹性削峰」的成本——通常优化先行、采购按到货周期倒排下单。
- id: day25-c3
  front: 训练/推理昼夜混部怎么做才安全？
  back: 分时调度+优先级反转（推理永远抢占训练，白天训练让路夜间吃满）。不是简单塞任务——要处理网络互扰（Day19）与优雅抢占（存 checkpoint 退出）。有效利用率可从 40% 拉到 65%+。
- id: day25-c4
  front: 采购论证一页纸的四段骨架？
  back: ① 缺口量化（P95 排队卡时×单价=体验损失）② 方案A买卡（资本+电力+折旧月摊）③ 方案B优化（混部/调度/量化的等效节省+工程投入）④ 推荐（B 先行见效快，A 按到货周期现在下单）。
- id: day25-c5
  front: 为什么说运维出身做容量规划有天然优势？
  back: 监控数据是运维的母语——把「感觉缺卡」变成「缺多少、什么时候缺、买 vs 优化差多少钱」的数据论证，正是运维日常（水位告警/容量报表）的自然延伸。
