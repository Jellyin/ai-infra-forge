- id: day29-q1
  q: 从收到「训练慢 10 倍无报错」工单到定位 NCCL transport 退化，完整排障链？
  a: DCGM 看 SM 形态（锯齿还是平）→ 平线偏慢查 NCCL_DEBUG=INFO 的 transport（Socket=退化确诊）→ ibstat 端口协商速率 → nvidia-smi nvlink。核心：无报错的慢第一嫌疑通信层。
- id: day29-q2
  q: 70B 全参训练的显存三本账（单卡 DDP 视角）？
  a: 权重 140GB + 梯度 140GB + Adam 优化器状态 840GB（一二阶动量+FP32 master，12B/参数）= 1120GB/卡——单卡不可能。FSDP 分片后 O(1120/N)。这就是 FSDP 存在的理由，用数字讲。
- id: day29-q3
  q: 推理服务和训练任务调度策略为什么相反（spreading vs binpacking）？
  a: 推理副本无耦合且要容灾（分散）；训练副本集合通信强耦合（同任务要近=拓扑），且紧凑装箱腾整机给下个大任务。老运维肌肉记忆要显式修正。
- id: day29-q4
  q: MFU 从 15% 提升到 42% 你会讲什么故事？
  a: 定位（DCGM 锯齿→数据饿）→ 修复（num_workers/预 tokenize/本地缓存）→ 验证（吞吐 9000→25000 tok/s）→ 账（等效省 X 卡时/月）。有数字因果链的优化叙事。
- id: day29-q5
  q: checkpoint 为什么要含优化器状态？体积代价是什么？
  a: Adam 动量是历史梯度统计，丢了=冷启动 loss 跳几百步。代价：优化器状态=权重×8 字节/参数——70B 完整 ckpt≈700GB，存储吞吐是平台级问题（分层异步保存）。
- id: day29-q6
  q: VLM 容量规划与纯 LLM 的三个差异？
  a: ① KV 按图像等效 token 计价（1024² 图≈4K token）② TTFT 含不可流式的编码段（瓶颈前移 prefill）③ 入口必须有图像闸门（4K 原图≈65K 等效 token）。
- id: day29-q7
  q: 「一训练全网业务抖」的三层修复？
  a: 网络隔离（训练独立 RDMA 网段/VLAN）、调度隔离（训练池与推理池节点分开）、协议层（RoCE 的 PFC/ECN/DCQCN 配置审查）。
- id: day29-q8
  q: 每日新卡上限为什么是间隔重复平台的必需品而不是可选优化？
  a: 无上限=首日洪水（全部新卡一天涌出）→次日复习山→第三天弃用——完成率漏斗在第一天就断了。Anki 默认 20/天是十年验证的留存设计（本平台用 5/天，卡片更重）。
- id: day29-q9
  q: 量化对推理容量的影响链（从精度到并发）？
  a: INT4 权重 140→35GB → 同卡 KV 池变大 → 并发上限提高（显存决定）→ 单卡吞吐↑成本↓。精度损失需业务指标实测，平台提供两档让用户选。
- id: day29-q10
  q: 前缀缓存在什么负载下收益巨大、什么负载下几乎为零？
  a: 公共 system prompt/多轮对话/RAG（前缀重叠高）收益数倍；ShareGPT 类真实对话（前缀不重叠）几乎为零。压测要用对负载——ShareGPT 压不出 prefix 收益是经典误导。
