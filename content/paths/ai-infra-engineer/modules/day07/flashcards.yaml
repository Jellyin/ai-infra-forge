- id: day07-c1
  front: LLM 网关和传统网关的三个差异？
  back: ① 流式 SSE 长连接(要关缓冲、设长超时)；② 并发上限由显存决定不是 CPU(限并发不是限 QPS)；③ 要按模型/版本/租户路由。
- id: day07-c2
  front: 为什么 LLM 网关要限并发数而不是限 QPS？
  back: 显存打满=服务直接 OOM 崩溃(不像 CPU 打满只是慢)。并发上限由显存决定，所以限流要限并发数。
- id: day07-c3
  front: 语义缓存(Semantic Cache)怎么省 GPU？
  back: 不是精确匹配 key，而是问题向量化后找语义相似的已缓存问答，超阈值直接返回。高频相似问题可省 50%+ 算力，是 LLM 平台特色手段。
- id: day07-c4
  front: LLM 网关最容易踩的超时坑是什么？
  back: 慢推理(长文本生成)被网关默认 60s 超时掐断。要把 read timeout 设到 300s 级别，并支持长连接不被 LB 空闲回收。
