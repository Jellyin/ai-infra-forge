- id: day20-c1
  front: 训练侧 mini 流水线的五步与各步把关？
  back: ①数据（清洗+留10%评测集）②微调（LoRA记可训占比/loss）③评测（eval loss+人工抽验，红线：过拟合回炉）④合并导出⑤vLLM上线+20题对照。一条命令跑通是毕业标准。
- id: day20-c2
  front: "为什么评测（Step3）是流水线的红线？"
  back: train loss 降≠效果好。没有 held-out 评测的微调是盲调——工程红线：eval loss 明显差于 train=过拟合，必须回炉补数据或调参，不给进发布。
- id: day20-c3
  front: 微调模型上线后怎么验收？
  back: 底座与微调模型同问20题对照（灰度思想在模型侧的缩影）；LoRA 合并后 TTFT/吞吐应与底座零差异（有差异=没合并对）。
