- id: day23-c1
  front: 高频 XID 码含义（79/48/63/64）？
  back: 79=GPU 掉了（驱动/链路，摘节点）；48=ECC 不可纠错（双比特，硬件实坏下线送修）；63/64=可纠错/污染（观察 SBE 增速，快涨=要坏前兆）。
- id: day23-c2
  front: SBE 计数为什么要入库监控？
  back: ECC 单比特错误持续增长是「要坏」的前兆指标——提前 2 周计划下线好过半夜炸。nvidia-smi -q 的 ECC 计数接 Prometheus 是 GPU 集群监控标配。
- id: day23-c3
  front: 故障注入软/硬两级方法？
  back: 软（无风险先练）：kill 训练进程模拟崩溃、ip link down 模拟网络抖动。硬（约窗口灰度）：拔 IB 线、nvidia-smi -r 重置 GPU、dcgmi inject。
- id: day23-c4
  front: 演练的北极星指标与频率？
  back: MTTR（发现+定位+恢复总时长）——真实故障表现≈最近一次演练表现。新平台每月关键场景一次，稳定后季度+大变更后加演。
- id: day23-c5
  front: runbook 的最小四行结构？
  back: 症状（怎么发现）→判断（≤3条定位路径）→处置（命令级）→升级（何时叫谁）。别写成文档工程——能在 3 分钟照做才有用。
