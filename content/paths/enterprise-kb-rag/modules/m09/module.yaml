id: m09
title: 查询理解：改写、多跳与元数据过滤
goal: 用户的问题往往不是适合检索的形式
order: 9
track: 阶段 3 · 检索质量
read: 20
lab: 35
concepts:
  - 查询改写与扩展（同义、去口语化、补全指代）
  - 多跳问题拆解：先检索什么、再检索什么
  - 意图识别与元数据过滤（把「我们部门的」变成过滤条件）
  - 时间与版本意图（「最新」要落到版本字段）
  - 把每个增强做成可开关的独立模块（便于评测归因）
  - 过度改写会引入漂移：要能量化其代价
checklist:
  - 能实现查询改写并量化其对召回的影响
  - 能把一个多跳问题拆成可检索的子查询
  - 能把自然语言意图映射成元数据过滤条件
  - 能说明每个增强模块的开关与归因方法
  - 能识别并量化改写带来的语义漂移
