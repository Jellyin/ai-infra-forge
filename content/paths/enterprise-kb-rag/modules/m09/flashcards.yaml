- id: m09-c1
  front: 查询改写有哪三类动作？
  back: '① 同义（AK→Access Key）；② 去口语化（去掉「咋回事」这类词）；③ 补全指代（把「上次那个」补成具体实体，依赖会话上下文）。三类策略不同：同义/缩写走领域词典，指代补全必须有上下文，不能凭空编造。'
- id: m09-c2
  front: 为什么查询改写要在提示词里强调「不引入用户没提过的实体」？
  back: 因为模型很容易「帮倒忙」——用户没说的实体一旦被补进去，query 就漂到了另一个意思上。约束它只做指代补全与省略还原、保留编号版本专有名词原始写法，并用 added_terms/dropped 把「改了什么」暴露出来供评测审计。
- id: m09-c3
  front: 多跳问题的本质特征是什么？工程上要注意什么？
  back: 本质是「第二步检索依赖第一步的结果」——不能一次检索解掉，必须显式拆成有顺序的子查询。工程要点：每跳单独评测（才知哪跳漏）、设跳数上限（如 3，超出就拒答或转人工，因为多跳容错最低、错误会累加）、只对标注为多跳的题开这条路径。
- id: m09-c4
  front: 把「我们部门的」映射成过滤条件时，过滤值该由谁决定？
  back: 由用户身份（服务端推导）决定，而不是模型生成或用户自由指定。范围类意图若允许自由指定就是越权漏洞。过滤在检索前生效，先缩小范围再算相似度。
- id: m09-c5
  front: 为什么「最新」不能当成普通词丢进检索？
  back: 因为「最新」不是一个词而是一个必须落到结构化字段的操作——要么 version = max，要么按 updated_at 排序/限定时间窗。当普通词处理时，BM25 会去匹配字面「最新」二字、向量会去匹配「新」的语义，两者都答不对。凡涉及时间/版本的词都要先翻译成过滤或排序。
- id: m09-c6
  front: 为什么要把每个查询理解增强做成独立可开关的模块？
  back: 为了归因。一次只开一个开关、跑同一黄金集、记录 before/after，才能知道是哪个增强在起作用。若两个增强同时上线，收益来自哪一个就无法判断。可开关同时意味着出问题时能快速定位与回退。
- id: m09-c7
  front: 改写的语义漂移可以用哪三个信号量化？
  back: '① 改写前后 query embedding 的余弦距离（1 - cosine，越低越疑似漂移，可设阈值如 cosine < 0.8 标记）；② 黄金集上 recall 与 precision 的 delta（recall 升但 precision 降=引入了无关词）；③ added_terms 中不在领域词典里的比例（比例越高越危险）。'
- id: m09-c8
  front: 为什么说「某增强开了反而变差」也是一个合格交付物？
  back: 因为它把「凭感觉保留一个看起来聪明的模块」挡在了发布之外。把负结论写进记录（默认关闭 + 原因），说明你做了可复现的归因，这比硬留一个没人能解释的增强更有工程价值。
