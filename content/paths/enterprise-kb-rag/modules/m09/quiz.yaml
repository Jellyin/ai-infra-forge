- id: m09-q1
  q: 「让模型做查询改写」为什么反而可能让检索变差？怎么量化这种风险？
  a: '改写可能把原问题改到另一个意思上，即语义漂移——模型补入了用户没提过的实体或做了过度同义替换。量化用三个信号：① 改写前后 query embedding 的余弦距离（1 - cosine，低于阈值如 cosine < 0.8 标记为疑似漂移）；② 黄金集上 recall 与 precision 的 delta（recall 升但 precision 降说明引入了无关词）；③ added_terms 中不在领域词典里的比例。阈值命中率过高就默认关掉该增强。'
- id: m09-q2
  q: 一个多跳问题该怎么拆解？为什么每跳都要单独评测？
  a: '拆成有顺序的子查询：hop1 找锚点（如「M4 评审定的超时阈值」得到值 X 与版本），hop2 依赖 hop1 的结果去验证现状（「超时配置」+ version 过滤得到现值 Y），最后 synthesize 对比。每跳单独评测是因为只有逐跳记 recall 才能看出是哪一跳在漏；只评最终答案会把定位问题这件事掩盖掉。同时要设跳数上限，超出就拒答或转人工。'
- id: m09-q3
  q: 「我们部门今年的报销标准」这句查询，该做哪些查询理解动作？各自要防什么错误？
  a: 不需改写；需要元数据过滤——dept = 当前用户所属部门（由身份推导，不是模型生成，否则越权）+ 时间窗「今年」映射到 updated_at 区间。单跳。最该防的是范围过滤值由模型或用户自由指定，那会变成越权漏洞。
- id: m09-q4
  q: 为什么要求每个查询理解增强都能独立开关？
  a: 为了归因。一次只开一个开关、跑同一黄金集、记录 before/after 的 recall 与 precision，才能判断收益来自哪个增强；两个增强同时上线就无法归因。可开关还意味着出问题能快速定位与回退，关不掉的增强将来也定位不了问题。
