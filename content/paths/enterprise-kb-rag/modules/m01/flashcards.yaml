- id: m01-c1
  front: 为什么立项阶段要「先定 SLO 再选模型」？
  back: 因为延迟、成本、可用性预算会反向约束选型——预算紧就得先做缓存与短上下文（甚至只做检索不做生成），预算宽才谈得上多跳与重排。先选模型再倒推 SLO，通常得到一个不敢报销的方案。
- id: m01-c2
  front: 三类提问者分别对应什么检索形态？
  back: 一线自助=单跳事实检索（覆盖度优先，允许说没找到）；熟练同事=精确匹配查证（编号/术语/版本，必须给引用）；决策者=多跳汇总推理（容错最低）。用一套策略通吃，通常三件事都做不好。
- id: m01-c3
  front: 答错代价分级如何决定架构？
  back: 低代价（自己再查一遍）可以只检索不生成、无引用；中代价必须双向链接引用；高代价（合规/资损/安全）必须引用+拒答+人工复核，外加越权防护与审计。被判为高代价的那类问题，会让后面每个里程碑都更贵。
- id: m01-c4
  front: 怎么判断一个成功标准「可验收」？
  back: 看能不能写出测量方法——谁测、测什么集合、什么算通过。例如「黄金集 200 题中事实类正确率 ≥ 85%、引用覆盖率 ≥ 90%」可验收；「准确率 95%」「体验良好」不可验收，因为写不出测量方法，只能变成评审会上的争论。
- id: m01-c5
  front: 语料盘点时必须顺带发现哪三类坑？
  back: ① 大量扫描件（无文本层，解析成本翻倍）；② 章节结构混乱、无标题层级（影响切分与引用锚点）；③ 权限归属混乱或跨多部门（无法映射成可过滤的属性）。
- id: m01-c6
  front: 为什么「本期不做」清单比 To-do 清单更重要？
  back: 项目失控的典型方式是范围蔓延。明确写下不做的事（如不做多模态、不回写源文档、不接全量历史），并给每一条写明「何时重新评估」，否则它会在第三次评审会上被悄悄推翻。
- id: m01-c7
  front: 语料盘点的目的是什么？（不是「知道有多少文件」）
  back: 让后面的切分、解析、权限、评测有依据：类型决定解析方式，更新频率决定增量策略，权限归属决定过滤条件，负责人决定内容运营。盘点表填不出来，说明还没准备好开工。
