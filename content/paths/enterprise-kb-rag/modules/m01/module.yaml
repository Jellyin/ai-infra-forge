id: m01
title: 立项：把「知识库」翻译成可验收的目标
goal: 先定义成功，再写第一行代码
order: 1
track: 阶段 1 · 立项与知识建模
read: 18
lab: 25
concepts:
  - 三类提问者与三类问题（事实检索/流程问答/多跳推理）
  - 答错的代价分级：为什么它决定架构
  - 延迟与成本预算：先定 SLO 再选模型
