- id: m01-q1
  q: 「回答准确率 95% 以上」为什么不能直接当验收标准？应该怎么改写？
  a: 因为写不出测量方法——谁测、测什么集合、什么算准确都没有定义，无法判定通过与否。应改写为可测量的形式，例如「黄金集 200 题中，事实类正确率 ≥ 85%，引用覆盖率 ≥ 90%，不可答问题拒答率 ≥ 95%」。
- id: m01-q2
  q: 三类提问者分别需要什么检索形态？为什么不能一套通吃？
  a: 一线自助需要单跳事实检索（覆盖度优先、允许说没找到）；熟练同事需要精确匹配（编号/术语/版本，必须给引用）；决策者需要多跳汇总。三者的召回策略、顶 k、重排与引用要求都不同，一套策略通吃通常三件事都做不好。
- id: m01-q3
  q: 「先定 SLO 再选模型」具体是怎么反向约束选型的？
  a: 首字延迟预算决定能否用大模型、要不要缓存与流式；端到端预算决定检索跳数上限、reranker 能否上、多跳是否拆解；单次成本上限决定上下文长度与模型分级策略。把这些数字先定下来，选型就成了在约束下求解，而不是选完再解释为什么慢/贵。
- id: m01-q4
  q: 若某类问题被判为「答错代价高」，架构上有哪些必然选择？
  a: 引用 + 拒答 + 强制人工复核是底线；此外还要有越权防护（检索期硬过滤）与审计日志。代价是后面所有里程碑都更贵：评测要更严、发布要更谨慎、回滚要更快。
