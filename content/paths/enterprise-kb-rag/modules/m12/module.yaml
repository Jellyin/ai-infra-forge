id: m12
title: 幻觉与越权：检索层与生成层的双保险
goal: 安全不是加个过滤器，是两道防线
order: 12
track: 阶段 4 · 生成与可信引用
read: 20
lab: 35
concepts:
  - 越权泄露的两条路径：检索过滤失效 / 生成侧拼装越权内容
  - 把权限做成检索期硬过滤 + 生成期二次校验
  - 文档内注入：语料里的恶意指令如何劫持回答
  - 输出的敏感信息与合规过滤
  - 红队用例：构造越权与注入测试集
  - 事故处置：发现泄露后的止血与影响面评估
checklist:
  - 能画出双保险的防线图并指出各自的失效模式
  - 能构造并跑通一组越权红队用例
  - 能复现一次文档注入并给出缓解措施
  - 能设计输出过滤规则并说明误杀代价
  - 能写出一次越权泄露的应急处置步骤
