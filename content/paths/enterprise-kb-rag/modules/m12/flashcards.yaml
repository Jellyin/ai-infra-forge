- id: m12-c1
  front: 越权泄露只有哪两条路径？各由哪道防线负责？
  back: '路径 A「检索过滤失效」——无权限的块进了证据集，由检索期硬过滤负责（白名单，命中即为零）；路径 B「生成侧拼装越权」——证据集干净但缓存/历史/工具/模型先验带出越权内容，由生成期二次校验负责。只做一道只能堵住一半。'
- id: m12-c2
  front: 为什么权限过滤必须和检索在同一次请求下发（pre-filter），而不能先取 top-k 再过滤（post-filter）？
  back: post-filter 有三个问题：① 污染 top-k，无权限块占掉了本属有权文档的位置，召回塌陷；② 只要有一处代码忘了过滤就直接泄露；③ 某些引擎会退化成全表扫。pre-filter 由服务端从会话身份构造过滤条件，与向量检索一起下发，才是硬过滤。
- id: m12-c3
  front: 生成期二次校验为什么必须对「权限真相源」复核，而不是对证据集复核？
  back: 如果二次校验只是重新看一眼检索已经过滤过的证据集，它没有增加任何保护。只有当检索期已经漏了、而校验期能独立地拿权限源发现「这个引用/片段我不该看」，第二道防线才成立。校验的价值在于独立性。
- id: m12-c4
  front: 检索期硬过滤和生成期二次校验，各自的失效模式是什么？
  back: 检索期过滤失效：过滤没下发或下发成 post-filter、块 acl 元数据缺失/陈旧、身份取自客户端、must/should 用错、索引早于权限变更。生成期校验失效：只复核自己看得见的证据集（等于没校验）、改写/翻译/摘要绕开指纹、模型先验内容无从比对、增加延迟。前者是强保证，后者是兜底。
- id: m12-c5
  front: 文档内注入为什么在 RAG 里真实存在？需要哪些前提条件？
  back: '因为「被检索到的文档文本」会和用户问题一起进入模型上下文——语料即输入。前提条件：① 攻击者能往语料写入内容；② 该内容会被检索进受害者上下文；③ 检索内容与指令拼在同一上下文、无角色/来源边界；④ 模型服从了文档里的指令。移除任一条件都能显著降低风险。它是真实且被广泛复现、但并非无条件的风险。'
- id: m12-c6
  front: 文档注入有哪些缓解措施？为什么不能宣称「已防住」？
  back: '缓解：划清数据与指令边界（文档放独立角色/分隔符并在系统提示声明不执行文档内指令）、来源标注与出处、工具调用前再过一遍权限、输出侧异常复核。诚实地说这些只是缓解——提示注入目前没有 100% 可靠的通用防御，目标是抬高攻击成本、缩小影响面，而非根除。'
- id: m12-c7
  front: 输出过滤为什么要评估「误杀代价」而不是只追求拦得全？
  back: 粗放的正则会把合法回答也拦掉（如 HR 助手本该回答薪资数字），用户被误杀烦了会直接关掉过滤器，于是保护归零。做法是按角色/场景配白名单与阈值，同时统计误杀率与漏拦率，原则是「宁可漏、不可误杀」。
- id: m12-c8
  front: 发现一次越权泄露后，应急处置的五个步骤是什么？
  back: ① 止血（关入口/kill switch、失效缓存、必要时吊销凭证）；② 界定影响面（用审计日志圈出哪些会话/查询/命中了哪些无权限文档/返回了什么）；③ 修正过滤或权限映射并重跑红队；④ 全面复核历史命中，确认是否有其他用户也命中；⑤ 复盘与按合规决定是否告知，并把用例补进回归集。
