- id: m19-c1
  front: 知识库有哪两类制品？为什么要一起版本化？
  back: '① 模型类（推理权重 + 提示词）② 索引类（embedding 模型版本 + 数据快照 + 切分参数）。必须一起版本化的核心原因：换 embedding 模型必须重建索引——查询向量与文档向量若落在不同向量空间，相似度计算失去意义，检索会静默失效（不报错，只是答非所问）。只发一类、另一类不动，会得到无法解释的质量漂移。'
- id: m19-c2
  front: 发布的「四元组」指什么？为什么要记录它？
  back: '代码（git commit）、模型（权重/镜像 index digest）、索引（collection + snapshot_id）、评测集（git commit + 数据集 digest）。它以 release manifest 随镜像走并注入环境变量，让每次线上回答都能回溯到这五个版本——出问题时才能回答「到底是哪一变导致了退化」。'
- id: m19-c3
  front: 为什么模型回滚和索引回滚有时必须一起做？
  back: '当且仅当模型变更包含 embedding 版本变更时。只回滚模型不回滚索引，新索引仍是新 embedding 建的、旧模型给出旧空间查询向量，两空间不匹配 → 静默失效。判据：回滚前先问「这次变更动了 embedding 吗」，动了就绑定回滚。'
- id: m19-c4
  front: 索引回滚的「快路径」和「兜底路径」分别是什么？为什么必须分清？
  back: '快路径是把别名（alias）指回旧快照——一次原子切换，分钟甚至秒级；兜底路径是重新构建并回填——耗时随语料规模线性增长，可能数小时。平时就要维护 kb_current → snapshot_N 的别名，旧快照不可删。分不清会导致以为回滚是 30 秒、实际是 3 小时。'
- id: m19-c5
  front: RAG 的金丝雀门禁为什么不能只看错误率？
  back: '因为 HTTP 200 不代表答对了。RAG 会静默失效——服务不报错、错误率正常，但检索命中率和引用覆盖率大幅下降。门禁必须同时看系统健康信号（错误率、p95）与质量信号（引用覆盖率、检索命中率、拒答行为）。判据：门禁看质量与错误预算，不看 CPU。'
- id: m19-c6
  front: 知识库交付相比普通 Web 服务，在 CI/CD 链路上要多做哪两件事？
  back: '① 索引的构建与晋升要走同一套纪律：索引构建作为流水线 job，产出不可变快照 + digest，按 dev→staging→prod 晋级而非手动跑脚本。② 回滚要能分别回退两类制品：GitOps 仓库同时记录镜像 index digest 与索引快照 id。否则会出现「镜像回滚了、索引还是新的」——旧编排配新索引。'
- id: m19-c7
  front: 多架构下发布最隐蔽的事故是什么？怎么防？
  back: '集群混有 amd64 与 arm64 节点、镜像只推了单一架构时，新副本在另一架构节点上 exec format error 起不来。症状隐蔽：发布停在 CrashLoop，指标分母为 0，金丝雀门禁既不算成功也不算失败——卡住而非明确失败。防护：推多架构 manifest、引用 index digest（app@sha256:index-digest）、按 kubernetes.io/arch 对齐 nodeSelector。'
- id: m19-c8
  front: 上线检查单里哪类项该做成会 fail 的 job，哪类该留人工？
  back: '凡机器能判定的都做成会 fail 的 job：release manifest 五元组齐全、索引快照可寻址、评测门禁不退化、embedding 版本一致、镜像 index digest 与部署清单一致、越权用例全拦。勾选表只留真正需要人判断的少数几项（oncall/runbook 就位、变更影响与回滚可逆性评审）。一张 90% 靠人勾的检查单迟早变成 90% 靠人跳过。'
