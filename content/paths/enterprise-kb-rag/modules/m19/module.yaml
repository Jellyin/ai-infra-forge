id: m19
title: 交付与发布：把知识库当生产系统上线
goal: 模型与索引都是制品，都要能版本化与回滚
order: 19
track: 阶段 7 · 上线与运营
read: 22
lab: 40
concepts:
  - 两类制品的版本化：模型（权重/提示词）与索引（embedding 版本/数据快照）
  - 用 CI/CD 交付：镜像、清单、GitOps 同步（呼应 DevOps 路径）
  - 环境晋级：dev→staging→prod 与数据隔离
  - 金丝雀：新链路小流量验证质量指标后再放量
  - 回滚演练：模型回滚与索引回滚分别怎么做
  - 上线检查单：把前 18 个里程碑的验收点收敛成一份可核对的清单
checklist:
  - 能说出本项目有哪几类制品、各自怎么版本化
  - 能把交付接进 GitOps 流水线并完成一次晋级
  - 能设计一次带质量门禁的金丝雀发布
  - 能完成一次索引回滚演练并记录耗时
  - 能产出一份可自动校验的上线检查单
