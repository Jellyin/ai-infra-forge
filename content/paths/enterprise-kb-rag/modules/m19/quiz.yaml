- id: m19-q1
  q: 为什么「换 embedding 模型」不能只发模型、必须连带重建索引？
  a: 因为检索依赖查询向量与文档向量在同一个向量空间里比较。换 embedding 模型后，用新模型编码的查询向量与旧索引里旧模型编码的文档向量不在同一空间，相似度失去意义，检索大面积失效——而且是静默失效（不报错，只是答非所问）。所以 embedding 版本是索引类制品的一部分，模型与索引必须对应同一时刻。
- id: m19-q2
  q: 一次发布拿到 trace id，你需要能查出哪五个版本？为什么这比「发布成功」更重要？
  a: 代码 commit、模型权重/镜像 index digest、提示词 commit、索引快照 id、评测集 commit。因为知识库的质量退化往往是多因素叠加、且静默的；没有这五者的对应关系，出问题时无法定位「到底是哪一变导致退化」，只能靠猜和全量回滚，代价极高。
- id: m19-q3
  q: 回滚为什么要区分对象？三类回滚的耗时与前置条件有何不同？
  a: 因为「回滚」不是一个动作。提示词回滚=git revert+重载，分钟级、无状态；应用回滚=rollout undo/argocd rollback，分钟级，前置是上一版 index digest 仍在；模型回滚=切回旧权重，分钟到小时级，前置是旧权重仍在且显存够；索引回滚=切别名（分钟级快路径）或重建（小时级兜底路径），前置是旧快照未删除。最易翻车：换了 embedding 时模型与索引必须一起回，且索引要走切别名而非重建。
- id: m19-q4
  q: 知识库的金丝雀质量门禁应该看哪些指标？为什么只把错误率做门禁是不够的？
  a: 至少两类：系统健康（错误率、p95 延迟、错误预算燃烧）与质量（引用覆盖率、检索命中率、拒答率）。只看错误率不够，因为 RAG 会静默失效——HTTP 200、错误率正常，但检索命中率与引用覆盖率大幅下降，系统「自信地答错」。门禁要用与用户体验挂钩的质量指标，failureLimit 不能设 1（抖动会误触发），且要留足样本量再判定。
