id: m02
title: 知识建模：元数据、权限与切分粒度的前置决策
goal: 这三个决策一旦定错，后面每一步都在还债
order: 2
track: 阶段 1 · 立项与知识建模
read: 20
lab: 30
concepts:
  - 文档类型 → 解析方式 → 切分粒度的映射
  - 元数据字段设计（来源/部门/密级/时效/版本）
  - 权限模型：谁能看哪些文档，如何表达成可过滤的属性
  - 引用锚点：答案要能指回原文的哪一级
  - 版本与时效：过期文档怎么办
  - 把这三个决策写成一份 ADR（架构决策记录）
checklist:
  - 能产出一份元数据字段表并说明每字段的用途
  - 能把权限模型表达成检索期可用的过滤条件
  - 能确定引用锚点的最细粒度（页/段/块）与理由
  - 能写出本项目的第一份 ADR
  - 能指出若切分粒度选错会引发哪些下游问题
