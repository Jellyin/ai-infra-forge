- id: m02-q1
  q: 如果切分粒度选错，会引发哪些下游问题？
  a: 块太大会导致召回噪声多、上下文浪费、成本升高；块太小会让语义割裂、跨块的答案无法还原、引用指不回原文；不均匀（FAQ/表格被拦腰截断）会让这些类型整体不可用。且切分是索引期决策，改它要全量重切重嵌重建索引。
- id: m02-q2
  q: 权限模型如何落到检索期可用的过滤条件？举一个后端例子。
  a: 把「谁能看什么」翻译成可求值表达式，例如「文档部门 ∈ 用户部门 ∧ 密级 ≤ 用户密级 ∧ 未过期」。Qdrant 用 filter（match.any 对数组字段、must_not 排密级）；Milvus 用标量布尔表达式（in / != ）；pgvector 用 Postgres RLS 把谓词下沉到行级。关键是过滤必须发生在检索期，且粒度到块级。
- id: m02-q3
  q: 为什么引用锚点必须在解析阶段就写入，事后补不回来？
  a: 因为锚点（页码、段落序号、标题路径）是从原始文档结构中提取的。解析产物一旦只存了正文和 doc_id，就丢失了块与原文位置的对应关系；要补锚点只能整篇重新解析并重建该文档的全部块。
- id: m02-q4
  q: 元数据字段设计的判断标准是什么？多值权限字段为什么特殊？
  a: 判断标准是「能否在检索期变成过滤条件、或能否变成引用展示」，满足才进 payload。多值权限必须用数组字段，因为过滤器要对它做 any 匹配（Qdrant match.any、Milvus in）；逗号串只能字符串包含，慢且易误判。
