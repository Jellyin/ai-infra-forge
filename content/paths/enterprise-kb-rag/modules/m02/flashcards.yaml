- id: m02-c1
  front: 为什么切分粒度、元数据字段、引用锚点是「索引期」决策而不是接入期决策？
  back: 因为它们一旦灌进数据就回不去——改任一个都要全量重切、重嵌、重建索引。所以必须在写接入管道之前冻结。锚点尤其如此，解析时没存，事后无法补，只能整篇重解析。
- id: m02-c2
  front: 「文档类型→解析→切分」映射的三个例子。
  back: Markdown/HTML 按标题层级切（结构即语义边界，标题路径可作锚点）；结构化 PDF 按节切、超长再按段落切（页码+章节可作锚点）；FAQ/工单按问答对切，一问答一块（跨块会答非所问）。
- id: m02-c3
  front: 为什么权限必须在检索期过滤，而不是生成之后过滤？
  back: 生成后过滤意味着越权内容已经进入了模型上下文，模型可能已经把它复述出来，再删块也晚了。检索期过滤是在候选集阶段就把越权文档裁掉。
- id: m02-c4
  front: 元数据字段「进不进 payload」的判断标准是什么？
  back: 只有能在检索期变成过滤条件、或能变成引用展示的字段才值得进 payload。只存关系库的字段在检索期要额外查库拼 ID，无法与向量检索融合。
- id: m02-c5
  front: 引用锚点的粒度由什么决定？
  back: 由里程碑 1 定下的答错代价分级决定。高代价（合规/资损）必须细到页码+段落或标题路径；低代价文档级即可。粒度越细，对解析产物的要求越高。
- id: m02-c6
  front: 处理过期文档的三种策略是什么？
  back: 只留最新（旧版打 status=archived 并检索排除，适用于旧版即错误的制度/价格）；全留但降权+标版本（有历史比对需求）；时效窗口（valid_to<now 的块过滤掉，适用于活动/临时政策）。
- id: m02-c7
  front: 多值权限字段为什么必须用数组而不是逗号串？
  back: 过滤器要对权限做 any 匹配。逗号串只能靠字符串包含，既慢又易误判，例如「人事部」会错误匹配到包含「人事部」的其他串。数组字段才能被 Qdrant 的 match.any、Milvus 的 in 正确求值。
- id: m02-c8
  front: 一份 ADR 至少要包含哪几个部分？
  back: 状态（已接受/日期）、背景（为什么现在必须定）、决策（具体定了什么）、后果（正面收益与至少一条负面代价，以及未决项）。写不出负面代价，说明还没真正做取舍。
