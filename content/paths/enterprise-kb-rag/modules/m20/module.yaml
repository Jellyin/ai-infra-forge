id: m20
title: 运营、演练与演进路线
goal: 把项目交给团队，而不是交给自己
order: 20
track: 阶段 7 · 上线与运营
read: 18
lab: 45
concepts:
  - 容量压测：找到拐点而不是只看平均值
  - 故障演练：索引损坏/模型不可用/权限误配/源站变更
  - 内容运营：过期知识清理、覆盖度补全、负责人机制
  - 成本优化路线：缓存/模型分级/批处理
  - 演进方向：多模态、Agent 化、微调与蒸馏的适用条件
  - 复盘与交接：把隐性知识变成文档与检查单
checklist:
  - 能设计并执行一次容量压测并指出拐点
  - 能完成一次故障演练并给出改进项
  - 能建立内容过期与覆盖度的运营机制
  - 能给出分阶段的成本优化路线
  - 能写出演进方向的选择依据与交接清单
