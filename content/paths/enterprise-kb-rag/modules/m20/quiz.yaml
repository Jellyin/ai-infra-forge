- id: m20-q1
  q: 一次容量压测如果只报告「QPS 是 120」，为什么等于没做？应该报告什么？
  a: 因为平均值掩盖拐点，无法回答「系统在哪里开始劣化」。应报告：阶梯加压下每一档的 p50/p95/p99 与吞吐、预热与样本量说明、固定变量记录，以及拐点——p95 开始非线性上升的那一档并发。更重要的是分层结论：RAG 瓶颈通常在检索或推理，必须给出一句话判断「并发 N 时 p95 突破 SLO，瓶颈在第几跳」。
- id: m20-q2
  q: 为什么故障演练「跑了但没出事」不算成功？演练的成功标准是什么？
  a: 演练的价值不是验证「系统没挂」，而是验证「指标能否发现它、预案能否止血、多快能止血」。成功标准是走完 注入→发现→决定→止血→恢复 的完整闭环并记录 MTTR，且至少产出一条带 owner 和截止日的改进项。没产生改进项的演练等于没演——因为下次真出事时，你还是没有新的应对手段。
- id: m20-q3
  q: 内容会「腐烂」，运营机制要解决哪三个问题？度量是什么？
  a: '三问题：① 过期（文档打 last_verified/owner，超 TTL 进复核）② 缺口（从在线反馈的无结果/低分问题聚类，用真实缺口驱动语料补全，而非凭感觉接入）③ 无人负责（每个源有 owner，否则沦为噪声）。度量是高频问题命中率与过期文档占比，不是「接了多少文档」——接得多但命中率低，只是把噪声变多。'
- id: m20-q4
  q: 要推进多模态、Agent 化或微调/蒸馏，先要回答什么问题？加固顺序为什么不能颠倒？
  a: 先问「当前瓶颈是知识还是能力」：答不对是因为没资料（知识）就补语料与检索；有资料也答不好（能力）才轮到微调与 Agent。加固顺序：先让运营机制有人负责，再让评测集对齐真实问题，最后才谈演进。因为运营与评测是信任根——没有它们，演进决策缺少判据，系统会自信地朝错误方向优化，投入越多越贵。
