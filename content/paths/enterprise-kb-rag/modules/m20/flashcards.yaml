- id: m20-c1
  front: 容量压测应该找什么，而不是看什么？
  back: '找拐点（knee）——p95 开始非线性上升的那一档并发，它是系统的真实容量边界；而不是看平均吞吐「QPS 是多少」。平均值会掩盖拐点。方法四条缺一不可：阶梯加压（每档稳定 2–3 分钟）、先预热 5–10 分钟再计时、每档样本量够（数千请求）、固定变量（索引/模型/评测集版本全记录）。'
- id: m20-c2
  front: 为什么 RAG 压测必须分层做？
  back: '因为 RAG 的容量瓶颈通常不在 API 层，而在检索与推理。分层测（只压检索→只压生成→端到端）才能确定拐点出现在哪一层。报告必须给出一句话结论：「并发 N 时 p95 突破 SLO，瓶颈在检索/推理的第几跳。」只测端到端无法定位瓶颈。'
- id: m20-c3
  front: 故障演练的价值是什么？成功标准是什么？
  back: '价值不是「系统没挂」，而是验证三件事：指标能否发现故障、预案能否止血、耗时多久（MTTR）。四类必演场景：索引损坏/不可用、模型不可用、权限误配、源站变更。成功标准：走完注入→发现→决定→止血→恢复的完整闭环并计时，且至少产出一条带 owner 的改进项——没有改进项的演练等于没演。'
- id: m20-c4
  front: 内容运营的三个机制是什么？为什么知识库会「腐烂」？
  back: '三机制：① 过期清理（文档打 last_verified 与 owner，超 TTL 进复核队列）② 覆盖度补全（从在线反馈的无结果/低分问题聚类，缺口驱动接入）③ 负责人机制（每个语料源有 owner）。腐烂原因：代码不会过期，知识会——源站变更、人员流动会让覆盖度静默下降。运营度量是「高频问题命中率」与「过期文档占比」，不是「接了多少文档」。'
- id: m20-c5
  front: 成本优化的三个阶段为什么必须按顺序做？
  back: '顺序：① 缓存（无损，高频问题直接命中）② 模型分级（需评测护航，路由判错会伤质量）③ 批处理与预算闸（影响体验）。原则是先做无损的、再做需评测护航的、最后做影响体验的。反过来做（先限额），会在最不该省钱的地方省钱。'
- id: m20-c6
  front: 多模态 / Agent 化 / 微调蒸馏，各自的适用条件是什么？
  back: '多模态：高价值问题确实依赖图片/表格/扫描件，且文本路径已扎实。Agent 化：问题需要多步操作（查多系统、计算、调 API）；单跳事实问答引入 Agent 只是延迟与不确定性成本。微调/蒸馏：有足够高质量领域标注、且提示工程已到上限；蒸馏适合把大模型能力压到自托管小模型省钱。判据：先问「当前瓶颈是知识还是能力」——是知识就补语料与检索，是能力才轮到微调与 Agent。'
- id: m20-c7
  front: 这条路径里最脆弱的一环通常是哪一段？为什么？
  back: '通常是[运营与演进]这一段及其依赖的[评测体系]。三个反直觉理由：① 它是唯一上线后就没人再投入的环节，投入最少、腐烂最隐；② 它依赖「评测集仍代表真实问题」这个前提，若真实问题已漂移而评测集没跟上，系统会自信地优化错方向；③ 它跨越最多边界（源站/权限/推理/向量库/成本），任一处无人负责都会在最需要时暴露。'
- id: m20-c8
  front: 针对最脆弱的一环，加固顺序是什么？排斥什么做法？
  back: '顺序：① 先让运营机制有人负责（owner + 过期清理 + 缺口驱动）② 再让评测集持续对齐真实问题（在线反馈闭环真正跑起来）③ 最后才谈演进（多模态/Agent/微调）。原则「先信任根后便利」：四元组可追溯、回滚可演练、评测可回归、容量已知是信任根。跳过前两步直接上演进，只是把「优化错方向」做得更贵。'
