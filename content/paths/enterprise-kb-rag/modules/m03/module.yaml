id: m03
title: 数据接入管道：多源、增量、可重跑
goal: 接入不难，难的是删除、更新与幂等
order: 3
track: 阶段 2 · 数据与索引
read: 20
lab: 35
concepts:
  - 多源接入：文件系统/Confluence/工单/代码库的取数与增量识别
  - 幂等：同一文档重复接入不能产生重复块
  - 增量与删除传播：删除必须能追到索引里
  - 断点续跑与失败隔离（单文档失败不阻塞全量）
  - 原始件归档与可追溯（解析结果要能回溯到原件版本）
  - 调度与并发：把接入做成可观测的作业
checklist:
  - 能画出接入管道的数据流（源→解析→切分→索引→登记）
  - 能说明删除是如何从源传播到向量库的
  - 能设计幂等键并解释为什么用文档指纹
  - 能实现单文档失败隔离并报告失败清单
  - 能给出接入作业的可观测指标（吞吐/失败率/滞后）
