- id: m03-c1
  front: 接入管道的数据流是哪五步？
  back: ① 取数（算出变更集）② 解析（原件→结构化文本+锚点）③ 切分（块+元数据）④ 索引（embedding→向量库 upsert）⑤ 登记（写登记表）。五步之间用可持久化中间态连接，任一步都能从上游单独重跑。
- id: m03-c2
  front: 幂等键为什么用文档指纹（内容哈希）而不是文件名或时间戳？
  back: 文件名会改、时间戳会被 cp/rsync/解压抖动，都不稳定；只有内容的规范形式稳定。且哈希要算在「解析后的规范文本」上而非原件字节上，否则元数据抖动会导致误判。指纹还应掺入 parser_version 与 chunker_version。
- id: m03-c3
  front: 删除是如何从源传播到向量库的？
  back: 靠检测 + 删除两个动作。检测用清单比对（本次源清单 vs 登记表）或 git diff 的 D 状态或 deleted_at；删除动作按 doc_id 过滤删除该文档全部块（Qdrant 用 filter delete，Milvus 用 delete expr）。没有这一步，用户能检索到已撤下的内容。
- id: m03-c4
  front: 断点续跑靠什么机制？
  back: 把作业状态（水位线 + 已完成 doc_id 集合）持久化落库。中断后从水位线继续，已完成的文档靠幂等键跳过。没有持久化水位线，每次重跑都是全量。
- id: m03-c5
  front: 单文档失败如何做到不影响全量？
  back: 逐文档 try/except，失败时把该文档标记为 failed 写进登记表并记录进失败清单，然后 continue 处理下一篇，作业照常跑完并输出失败清单。整批一个 try/except 会让一篇坏文档拖垮全部。
- id: m03-c6
  front: 为什么接入管道必须归档原始件？
  back: 为了可追溯：解析结果要能回溯到原件版本。定位错误回答时需要还原「当时喂给模型的确切文本」；解析器升级后出问题要能对比新旧解析结果。没有归档，这条链路一断就只能靠猜。
- id: m03-c7
  front: 接入作业的最小可观测指标有哪几个？
  back: 吞吐（块/秒、文档/分钟）、失败率（失败文档/处理文档）、滞后（源变更时间→索引可见时间）、队列深度（待处理文档数）、重试/死信数。滞后指标回答「语料新不新鲜」，失败率与死信回答「健康度」。
- id: m03-c8
  front: 权限变更为什么是最容易漏掉的传播通道？
  back: 因为文档还在、内容没变，只是 ACL 从「全公司可见」改成「仅 HR 可见」。若接入管道只按内容哈希判断「没变就跳过」，权限字段永远不会更新。解法是指纹包含 ACL 版本，或单独监听 ACL 变更事件。
