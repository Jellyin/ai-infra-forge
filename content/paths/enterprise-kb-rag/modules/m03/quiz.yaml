- id: m03-q1
  q: 为什么删除必须能传播到索引？用什么机制实现？
  a: 因为源站删除后若向量库仍保留旧块，用户就能检索到已撤下的内容（合规风险）。实现靠检测加删除两步：检测用清单比对（本次源清单 vs 登记表）或 git diff 的 D 状态或 deleted_at 字段；删除按 doc_id 过滤删除该文档全部块（Qdrant filter delete、Milvus delete expr）。
- id: m03-q2
  q: 设计一个幂等键，并解释为什么用文档指纹而不是文件名。
  a: 例如 chunk_uid = sha256(doc_id + chunk_index + chunk_text_hash)，doc_fingerprint = sha256(规范文本 + parser_version + chunker_version)。用指纹是因为文件名会改、时间戳会抖，只有内容的规范形式稳定；掺入 parser/chunker 版本是为了让解析器升级前后生成不同代，避免新旧块混淆。
- id: m03-q3
  q: 单文档失败如何隔离？为什么失败态也要写进登记表？
  a: 逐文档 try/except，失败时标记 failed、记入失败清单并 continue 处理下一篇，作业照常跑完。失败态必须写登记表，否则下次增量会当它没处理过而反复重试同一篇坏文档，或被当作已处理而永久遗漏；登记后重试才有依据，可配最大重试次数与死信队列。
- id: m03-q4
  q: 接入作业应该暴露哪些可观测指标？各自回答什么问题？
  a: 吞吐回答「消费速度」；失败率与死信回答「健康度」；滞后（源变更到索引可见的时间）回答「语料新不新鲜」；队列深度回答「消费是否跟得上」。没有滞后指标就不知道语料是否过期，这是接入作业最常见的盲区。
