- hint: 起一个本地向量库（Qdrant，REST 端口 6333）
  cmd: docker run -d --name qdrant -p 6333:6333 -v "$(pwd)/qdrant_storage:/qdrant/storage" qdrant/qdrant
- hint: 备选——用 pgvector 的全文检索（ts_rank）当混合检索里的 BM25 一路
  cmd: docker run -d --name pgv -e POSTGRES_PASSWORD=pg -p 5432:5432 pgvector/pgvector:pg16
- hint: 装本地 BM25 与交叉编码器（小模型无 GPU 也能跑）
  cmd: pip install rank_bm25 sentence-transformers
- hint: 确认向量库已就绪（列出所有 collection）
  cmd: curl -s http://localhost:6333/collections
- hint: 量一次 reranker 在候选量上的实际延迟（把 50 换成你的 top-k）
  cmd: 'python -c "import time; from sentence_transformers import CrossEncoder as C; m=C(\"cross-encoder/ms-marco-MiniLM-L-6-v2\"); p=[(\"q\",\"d\")]*50; t=time.perf_counter(); m.predict(p, batch_size=32); print(f\"{time.perf_counter()-t:.3f}s for 50 pairs\")"'
