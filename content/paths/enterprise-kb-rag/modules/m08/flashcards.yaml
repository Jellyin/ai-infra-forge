- id: m08-c1
  front: 为什么说 BM25 与向量检索是互补而非竞争？
  back: 向量擅长语义相近（概念题、口语题），但不擅长精确符号（错误码、工单号、缩写、产品名、版本号），会把 0xE003 与 0xE004 当成近似；BM25 恰恰擅长精确匹配。企业语料里最要命的就是这些精确符号，所以两路合起来才覆盖完整。
- id: m08-c2
  front: RRF 的公式是什么？k 常取多少？
  back: 'score(d) = Σ_r 1/(k + rank_r(d))，其中 r 遍历每个检索器，rank_r(d) 是该文档在第 r 路中的名次（从 1 开始），k 是平滑常数、常取 60（Cormack 等人 2009 年原始设定）。k 越大名次差距被压得越平。'
- id: m08-c3
  front: RRF 为什么不需要调权重？
  back: 因为不同检索器分数量纲不可比——BM25 分数无上界，余弦相似度在 [-1,1]。加权融合必须先归一化，而归一化方式本身又是一个要调、要维护的超参且对异常值敏感。RRF 只用名次，名次天然可比、尺度无关，两路等权就足够鲁棒，等于少了一个持续维护的超参。
- id: m08-c4
  front: 什么时候才该用加权融合而不是 RRF？
  back: 只有当你确信分数分布稳定、且愿意持续维护归一化与权重、并做到每次改权重都跑评测时才用。若还没有「改权重就回评测」的纪律，没人维护的权重比等权 RRF 更危险。
- id: m08-c5
  front: 两段式检索里，粗排的 k 与重排的 n 各应取大还是取小？
  back: '粗排 k 要够大（如 50），负责「召回」——保证正确文档别漏掉；重排 n 要够小（如 8），负责「精度」——只把最相关的送给 LLM。重排是交叉编码器，每个候选都要过一次前向，慢且吃显存，所以只在「正确文档已在 top-k 内但排不进 top-n」时才加。'
- id: m08-c6
  front: 领域词典该在索引期扩展还是查询期扩展？
  back: 首选索引期扩展——它只让同一实体的多种写法都能被匹配到，不改变用户意图，提升召回。查询期扩展会往 query 里塞用户没说的词，直接引入语义漂移，需评测通过后才开。
- id: m08-c7
  front: reranker 上线的判据是什么？
  back: 必须先定延迟预算（如 p95 ≤ 150ms），再实测。上线需同时满足两条：precision 提升达到门槛（如 +10%）且延迟仍落在端到端预算内。只满足一条都不上——「感觉变好了」不是判据。
- id: m08-c8
  front: 为什么本模块要求「每次改动都回评测」？
  back: 检索的改动极易产生「我觉得好像好了」的错觉。没有同一黄金集的 before/after 数字，任何改动（换 k、开 reranker、改词典）都视为未验证。这是把主观感受挡在发布之外的唯一手段。
