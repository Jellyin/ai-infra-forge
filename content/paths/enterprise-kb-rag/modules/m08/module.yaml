id: m08
title: 混合检索与重排
goal: 向量不是万能的：精确词、缩写、编号要靠 BM25
order: 8
track: 阶段 3 · 检索质量
read: 20
lab: 35
concepts:
  - BM25 与向量检索的互补场景
  - 融合策略：RRF 与加权融合的取舍
  - reranker 选型与代价（延迟、显存）
  - 领域词典：缩写、产品名、内部术语的注入
  - 两段式：粗排 top-k → 重排 top-n
  - 每次改动都要回评测，禁止凭感觉上线
checklist:
  - 能实现混合检索并对齐两条召回的分值尺度
  - 能说明 RRF 为什么不需要调权重
  - 能为 reranker 定出延迟预算并测量实际代价
  - 能建立起领域词典并验证收益
  - 能用评测数据证明改动有效，而不是主观判断
