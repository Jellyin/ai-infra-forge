- id: m08-q1
  q: RRF 的公式是什么？为什么它不需要像加权融合那样调权重？
  a: '公式为 score(d) = Σ_r 1/(k + rank_r(d))，k 常取 60，rank 从 1 开始。不需要调权重的原因是：不同检索器的分数量纲不可比（BM25 无上界、余弦在 [-1,1]），加权融合必须先归一化、而归一化方式又是一个要维护的超参且对异常值敏感；RRF 只用名次，名次天然可比且尺度无关，两路等权即鲁棒。'
- id: m08-q2
  q: 什么情况下应该引入 cross-encoder 重排？上线判据是什么？
  a: 只有当粗排的 precision 是瓶颈、即正确文档已在 top-k（如 50）内但排不进 top-n（如 8）时才引入。上线判据两条同时满足：precision 提升达到门槛（如 +10%），且检索 p95 延迟仍落在端到端预算内（如 ≤ 150ms）。重排是交叉编码器，每个候选都要过一次前向，慢且吃显存，不是默认步。
- id: m08-q3
  q: 领域词典为什么优先在索引期扩展，而不是查询期扩展？
  a: 索引期扩展只让同一实体的多种写法都能被匹配到，不改变用户意图，直接提升召回。查询期扩展会往 query 里注入用户没说的词，引入语义漂移。所以默认只开索引期扩展，查询期扩展需评测（词典命中率 + recall 增量）通过后才开。
- id: m08-q4
  q: 为什么本模块把「每次改动都回评测」定为硬要求？
  a: 检索的改动（换 k、开 reranker、改领域词典）极容易产生「感觉变好了」的错觉。要求每次改动都在同一黄金集上留下 before/after 的 recall、precision、延迟数字，才能把主观判断挡在发布之外。没有这组数字，改动一律视为未验证。
