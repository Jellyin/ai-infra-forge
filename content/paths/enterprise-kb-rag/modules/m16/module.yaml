id: m16
title: 多租户与权限落地
goal: 企业级的分水岭：同一套索引服务多个隔离域
order: 16
track: 阶段 6 · 平台化
read: 22
lab: 40
concepts:
  - 隔离的三个层次：物理索引 / 逻辑集合 / 元数据过滤
  - 租户与用户的二维权限模型
  - 把权限规则翻译成向量库的过滤表达式并验证其不可绕过
  - 权限变更的传播延迟与强制刷新
  - 删除请求（被遗忘权）的端到端传播
  - 审计日志：谁在什么时候问了什么、命中了哪些文档
checklist:
  - 能画出三层隔离方案并给出本项目的选择
  - 能实现按权限过滤的检索且通过越权测试
  - 能说明权限变更多久生效、如何验证
  - 能实现删除请求的端到端传播并验证
  - 能设计既合规又不侵犯隐私的审计日志
