- id: m16-c1
  front: 隔离的三个层次各是什么？强弱与成本如何取舍？
  back: '物理索引（每租户独立 collection/实例，最强隔离、最高运维成本、爆炸半径单租户）；逻辑集合（共享实例按 collection/分区切租户，中等）；元数据过滤（共享 collection，块带 tenant_id 查询期过滤，最弱——正确性全压在过滤上、成本最低但爆炸半径是全租户）。选型要同时写明"何时升级到物理隔离"的触发条件。'
- id: m16-c2
  front: 租户与用户构成的二维权限模型是什么？
  back: '第一维租户（组织/工作区）是一切检索的最小边界，跨租户无例外；第二维主体（用户/组/角色）决定租户内可见范围。每块挂 tenant_id + acl[] + doc_id（+可选 sensitivity）。有效可见集 = 用户所属组（含服务端展开的继承）∩ 该租户；缺省拒绝，acl 为空即不可见。'
- id: m16-c3
  front: 权限成白名单还是黑名单？为什么这个区别重要？
  back: '必须白名单：全部条件满足才可见（milvus 用 and / Qdrant 用 must），不匹配即不可见；绝不能用 should/OR 让"满足任一即可"。黑名单或 should 会让一个租户用户凭 acl 命中就取到别的租户的块，租户边界失效。'
- id: m16-c4
  front: 权限变更为什么会有传播延迟？如何做到撤权尽快生效？
  back: '真相源（IAM/DB）是唯一定义，向量库里的 acl 是反规范化副本，副本必然陈旧。做法：用户的组在查询期从 IAM 展开（撤权即时），块 acl 存索引里（容忍秒级传播），并加快捷通道——撤权/换组/离职立即失效该主体缓存并把受影响 doc_id 打入 denylist。把"撤权到生效"写成 SLO（如 ≤60s）并用脚本轮询验证。'
- id: m16-c5
  front: 删除请求（被遗忘权）为什么不是一条 delete 语句？
  back: '它是逐环验证的流程：①真相源删除/标记 tombstone；②向量库按 doc_id 过滤批量删除；③失效查询/答案/嵌入/rerank 缓存；④清理派生数据（摘要/实体/图谱/评测样本）；⑤备份与不可变日志按保留策略处理。收尾必须反查（用该文档特征再检索断言 0 命中），并如实标注备份/日志在保留期内可能不可删。'
- id: m16-c6
  front: 审计日志里为什么要分开记 retrieved_ids 和 returned_ids？
  back: 'retrieved_ids 是命中并进入上下文的文档/块，证明"有没有取到不该取的"；returned_ids 是最终出现在回答里的引用，证明"有没有说出去"。两者分开才能定位泄露发生在检索期还是生成期（对应 m12 的两条路径），也才能做越权溯源。'
- id: m16-c7
  front: 审计日志的合规价值与隐私边界分别是什么？
  back: '合规价值：越权溯源、删除举证、访问报表、规则回归。隐私边界：最小化字段（查询原文加密+短期保留或只存哈希，actor 用稳定假名）、目的限定（只用于安全与合规，不得用于绩效/监控）、禁止个体画像（不做按人提问次数排行、聚合设最小样本量）、日志自身访问再审计、对员工透明。一旦变成"谁问得多"的排行榜就沦为监控工具。'
- id: m16-c8
  front: 怎么验证权限过滤「不可绕过」？
  back: '六项自动化检查：①身份不可伪造（请求体里的 tenant/groups 被忽略）；②过滤非后置（与检索同一次下发）；③白名单语义（用户组为空返回 0 命中而非全部）；④跨租户（用 B 租户身份检索 A 的已知块返回 0）；⑤语义绕过（把无权限块的向量直接当检索向量仍 0 命中）；⑥组合逻辑（把 must 改 should 的测试能捕获误放行）。'
