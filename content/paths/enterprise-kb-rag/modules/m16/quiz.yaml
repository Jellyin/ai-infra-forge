- id: m16-q1
  q: 三层隔离（物理索引/逻辑集合/元数据过滤）如何取舍？选型时必须补写什么？
  a: '物理索引隔离最强但运维成本随租户数线性增长、爆炸半径最小；元数据过滤成本最低但正确性全压在过滤上、爆炸半径是全租户；逻辑集合居中。取舍看合规要求、租户数量与能接受的爆炸半径。选型时**必须**写明"什么时候升级到物理隔离"的触发条件（合同约定/行业监管/大客户），否则会被一个合规客户逼到临时改架构。'
- id: m16-q2
  q: 为什么权限过滤必须是白名单（must/and）而不能用 should/OR？
  a: '因为租户边界必须与其他条件同时成立。should 是"满足任一即可"，一个 tenant-a 用户会凭 acl 命中就取到别的租户里恰好同名的组块，租户隔离形同虚设。正确做法是所有条件 must 同时满足、不匹配即不可见，即缺省拒绝的白名单语义。'
- id: m16-q3
  q: 权限变更后多久生效、怎么验证？为什么会有延迟？
  a: '延迟来源：真相源（IAM）与向量库里的 acl 副本不一致——查询期实时展开用户组可保证撤权即时，但块 acl 是反规范化副本会陈旧。做法是查询期展开用户组 + 快级传播块 acl + 强制刷新通道（撤权即失效该主体缓存、受影响 doc_id 入 denylist）。验证：把"撤权到生效"写成 SLO（如 ≤60s），用脚本"撤权→轮询检索→断言 SLO 内变 0 命中"。'
- id: m16-q4
  q: 设计审计日志时，怎样才算"既合规又不侵犯隐私"？
  a: '合规侧：记全 ts/tenant/actor/request_id、query_hash、retrieved_ids（区分于 returned_ids）、decision、policy_ver，能答出"谁在何时问了什么、命中了哪些文档"。隐私侧：字段最小化（actor 用稳定假名、查询原文加密且短期保留）、目的限定（仅用于安全与合规，不得用于绩效/监控）、禁止个体画像（不做按人提问次数排行，聚合设最小样本量）、日志自身访问再审计、对员工透明。'
