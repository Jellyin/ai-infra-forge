- id: m15-c1
  front: 为什么显式反馈（点赞/点踩）不够，还要靠隐式信号？
  back: 企业内网里没人爱打分，显式反馈覆盖率低且有偏（只有极端满意或不满的人会点）。隐式信号零打扰且往往更诚实——引用点击率、复制率、追问率、同问题重问率。但隐式信号有歧义（引用点击率下降可能是引用变差，也可能是答案更可信不用核对），必须交叉验证。
- id: m15-c2
  front: 反馈埋点必须带哪些字段才能归因？
  back: 最小集合含 query_id（回连主键）、action、retrieved_chunk_ids、model_version、prompt_version、evalset_version。没有 query_id 就无法回连问题与命中块，没有版本号就无法归因到某次改动。埋点后必须做一次「回连演练」——从一条反馈完整串到提问原文与命中块，串不通就是白埋。
- id: m15-c3
  front: bad case 应该归因到什么粒度？为什么「归因到模型」等于没归因？
  back: 要归因到具体链路环节——检索漏召、排序错、上下文丢失、生成幻觉、引用错、该拒未拒/误拒、权限误伤。「归因到模型」是一句无法派活的话，闭环就断在归档这一步；只有落到环节，才能确定改切分、改 rerank、改拼装还是改提示词。
- id: m15-c4
  front: 影子流量是什么？它有什么局限？
  back: 让新链路对同一批线上问题在旁路重跑一遍、结果不返回给用户，用于高风险改动上线前验证。好处是零用户风险且能拿到真实问题分布；局限是拿不到真实用户反馈（用户没看到新结果），且成本翻倍。纪律是影子结果不得进面向用户的日志/缓存，只对有权限的流量做，并同样脱敏。
- id: m15-c5
  front: 灰度 A/B 为什么按 user_id 哈希分桶，而不是按请求随机？
  back: 因为要保证同一用户稳定落在同一组。按请求随机会让同一人来回切换，既污染体验，也会混入「切换混乱」造成的差异，使 A/B 结论不可信。分桶后还要提前算 MDE（要检测多大提升需要多少样本），报置信区间与 p 值，并同期看延迟、拒答率等护栏指标。
- id: m15-c6
  front: 反馈回流进评测集要守哪些纪律才不使其失真？
  back: 一是只加不删（除题本身有错）；二是新增题要与线上分布对齐，不能只收投诉最多的一类，且四类都要收（尤其「该拒未拒」的投诉）；三是 gold 必须人工重标，绝不拿模型当时的输出当 gold；四是防过拟合——留 held-out 集或采用滚动窗口，二者至少选一。
- id: m15-c7
  front: 评测集过拟合怎么防？为什么它会悄悄发生？
  back: 每轮都把失败题加进去反复调，系统就会在这批题上过拟合——指标持续涨、线上却不动。它之所以悄悄发生，是因为「加题」看起来总是好事。对策是留出一部分 held-out 永不参与调优只做最终验证，或采用滚动窗口（新题做验证、旧题退役）。
- id: m15-c8
  front: 迭代节奏该按什么定？谁拍板、要留什么记录？
  back: 按改动风险与成本定，不是按日历——提示词/阈值微调每次改动跑门禁，rerank/k 类周级加小流量灰度，换模型/换切分类走影子流量加 A/B、双周至月度。判定权（指标是否达标）归质量负责人，上线与回滚归技术/业务 owner，涉权限合规要会签。每次迭代留决策记录——改了什么、指标怎么变、谁批的、回滚条件是什么。
