id: m15
title: 在线反馈与持续改进闭环
goal: 线下的评测集救不了你没见过的问题
order: 15
track: 阶段 5 · 评测体系
read: 20
lab: 30
concepts:
  - 反馈采集：点赞/点踩/纠错/引用点击（低打扰设计）
  - bad case 归档与分类归因
  - 影子流量：新链路旁路跑，不影响用户
  - 灰度与 AB：分流量口径与显著性
  - 反馈回流到评测集（防止评测集过拟合）
  - 迭代节奏：多久评一次、谁拍板
checklist:
  - 能设计一套低打扰的反馈采集方案
  - 能把 bad case 归因到具体链路环节
  - 能设计影子流量方案并说明对比口径
  - 能说明如何用线上反馈更新评测集而不使其失真
  - 能定出本项目的迭代节奏与决策责任人
