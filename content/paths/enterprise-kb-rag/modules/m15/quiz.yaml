- id: m15-q1
  q: 设计一套低打扰的反馈采集方案，要遵守哪几条原则？
  a: 一是零打扰优先、一次点击封顶——👍/👎 一步完成，纠错藏在点踩之后再展开，不弹窗、不打分星级；二是隐式信号优先于显式（引用点击、复制、追问、同问题重问）；三是每条事件必须带 query_id、命中块、版本号等可归因字段，并做脱敏与保留期管理。原则的核心是「收了能定位」，收一堆无法归因的情绪等于没收。
- id: m15-q2
  q: 影子流量验证不了什么？该怎么补？
  a: 影子流量让新链路在旁路跑但不返回用户，所以它验证不了「用户是否更喜欢」——用户根本没看到新结果，拿不到真实点击反馈。它能回答的只是「新链路相对现网会不会更差」。要补的方法是：影子指标通过后，再走小流量灰度 A/B，用 user_id 哈希稳定分桶，看真实点击率与护栏指标。
- id: m15-q3
  q: A/B 实验里为什么同一用户要稳定分组？同期还要看什么？
  a: 按 user_id 哈希分桶保证同一用户始终落在同组，避免来回切换污染体验、也避免把「切换混乱」混进组间差异。同期必须看护栏指标——延迟 P95、错误率、误拒率、漏拒率；主指标涨但护栏崩就不算赢。此外要先算 MDE 再判显著性，报置信区间而不是只报点估计。
- id: m15-q4
  q: 如何用线上反馈更新评测集而不使其失真？
  a: 四条。一是只加不删，只有题目本身有错才删且留记录；二是新增题与线上分布对齐、四类都要覆盖（尤其「该拒未拒」这类），不能只收投诉最多的一类，否则评测集偏向投诉集中区而失去代表性；三是 gold 必须人工重标，绝不拿模型当时的输出当 gold；四是防过拟合，留 held-out 集或采用滚动窗口，二者至少选一。
