- id: m07-q1
  q: recall@5 = 0.62 的分子分母分别是什么？它和「答对率」是一回事吗？
  a: 分母是该 query 应召回的全部相关块数（黄金集标注的），分子是其中落进前 5 的个数，逐 query 算完再平均。它衡量的是「该召回的块有没有被召回」，不是「回答对了几成」，所以不能当答对率或覆盖率用。若每个问题只有 1 个正确块，它就退化成命中率 hit@5，报告必须注明口径。
- id: m07-q2
  q: 什么情况下该用 MRR 而不是 recall@k？
  a: 当每个 query 基本只有一个正确答案、且你在意「第一个正确结果排多高」时用 MRR（RR = 1/rank，无相关结果则 0，再取平均；对 top-1 极敏感）。当一个 query 有多个相关块、且希望它们都进 top-k 时用 recall@k。判据是：关心「召回全不全」用 recall@k，关心「第一个对不对」用 MRR。
- id: m07-q3
  q: 把相似度阈值调低后「结果不再为空」，这一定是好事吗？
  a: 不一定，往往是坏信号。阈值是分数下限，调低会让低分噪声混进上下文——检索总会返回 k 条「最像的」，哪怕全都不相关。用低阈值换「有结果」，等于用噪声冒充覆盖率，还会拉低生成质量。正确做法是按度量校准阈值（cosine ∈ [-1, 1]、dot 无界、L2 ≥ 0），让低相关时触发「没找到/拒答」。
- id: m07-q4
  q: 一条 query 召回为 0，你如何判断是「语料缺失」还是「检索失败」？各自怎么修？
  a: 拿正确答案里的关键词去原始语料 grep：查不到就是语料缺失，修法是补数据或补解析（例如 PDF 没有文本层）；查得到却没进 top-k 就是检索失败，修法是改切分、换 embedding 或上混合检索。还有第三类：答案跨块被切断，表现像检索失败但根因在切分，要回 m05 用父子块解决。
