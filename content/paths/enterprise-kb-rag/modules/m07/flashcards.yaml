- id: m07-c1
  front: recall@k 的分母到底是什么？
  back: 分母是「该 query 应召回的全部相关块数」（黄金集里标注的），不是 k，也不是库里总块数。公式为 recall@k = |相关块 ∩ 前 k| / |全部相关块|。因此 recall@k 恒 ≤ 1；当相关块数 > k 时天然存在上限 < 1，所以 k 要结合「每个问题平均有几个正确块」来定。
- id: m07-c2
  front: hit@k 与 recall@k 有什么区别？为什么报告里要写清口径？
  back: 当每个 query 只有 1 个正确块时，recall@k 退化为 0/1 的命中率 hit@k。很多 RAG 口径说的 recall@5 其实是 hit@5。两者数值含义不同，报告里必须写清是哪种口径，否则跨系统、跨版本的数字不可比。
- id: m07-c3
  front: MRR 的定义是什么？什么场景该用它？
  back: 对每个 query 求第一个相关结果名次的倒数 RR = 1/rank（无相关结果则 RR = 0），MRR 是所有 query 的 RR 平均值。它对 top-1 极敏感，适合「每个问题基本只有一个正确答案」的查证类场景；一个 query 有多个正确块、且希望都进 top-k 时，应该看 recall@k。
- id: m07-c4
  front: top-k 与相似度阈值各管什么？为什么阈值不能照抄？
  back: top-k 控制返回条数（k 大→延迟与噪声↑，k 小→漏召回↑）；阈值是分数下限，控制是否返回与是否拒答（过高会挡掉正确结果，过低会放进噪声）。阈值量纲取决于度量——cosine ∈ [-1, 1]、dot 无界、L2 ≥ 0——换模型、换度量、换归一化都要重新校准，不能照抄别人的数字。
- id: m07-c5
  front: 为什么「看起来像」不等于「答得对」？
  back: 高相似度只说明向量方向接近，不说明这段内容回答了问题。典型反例：命中同名但不同版本的文档、命中相同关键词但讲的是另一个场景、命中「我们不做 X」而问题问「X 怎么做」。所以评测必须用人工标注的「正确块」，而不是模型自评的相似度。
- id: m07-c6
  front: 召回失败的两类根本原因是什么？怎么区分？
  back: ① 语料缺失——正确内容根本不在库里，全库或原文检索都找不到，修法是补数据/补解析；② 检索失败——内容在库里却没进 top-k，修法是改切分、换模型或上混合检索。区分方法：拿正确答案里的关键词去原始语料 grep，查不到是语料缺失，查得到但排名靠后是检索失败。还有第三类隐患：答案跨块被切断。
- id: m07-c7
  front: 为什么要把基线评测固化成一条可重复运行的命令？
  back: 因为「改动是否有效」必须可判定。没有可重复的命令，每次改动只能凭感觉；固化后（命令与黄金集一起进版本库），改切分/换模型/加策略前后各跑一次，用两个数字说话。黄金集一旦改动要在报告里标注，否则新旧数字不可比。
- id: m07-c8
  front: 召回率偏低时，第一步该做什么？
  back: 先别换模型。先对失败 query 做归因：拿正确答案里的关键串在原始语料里 grep，判断是「语料缺失」还是「检索失败」。语料里根本没有的内容，换任何模型都召不回；只有确认是检索失败，才轮到改切分、换 embedding 或上混合检索。
