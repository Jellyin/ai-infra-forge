id: m04
title: 解析与清洗：版面、表格、层级与噪声
goal: 解析质量是检索质量的上限
order: 4
track: 阶段 2 · 数据与索引
read: 20
lab: 35
concepts:
  - PDF/扫描件/表格/图文的解析选型与代价
  - 版面与层级保留（标题层级决定切分质量）
  - 表格与代码块的特殊处理
  - 噪声去除：页眉页脚/水印/目录页/乱码
  - 解析失败的探测与降级（宁可标记不可用，不要静默丢内容）
  - 解析结果抽样验收：怎么抽、看什么
checklist:
  - 能为自己的语料选出解析方案并说明取舍
  - 能给出解析质量的抽样验收方法与通过标准
  - 能处理版面层级以支撑结构感知切分
  - 能设计解析失败的降级与告警路径
  - 能指出哪类文档在你的项目里必须人工兜底
