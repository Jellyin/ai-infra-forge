- id: m04-c1
  front: 为什么说「解析质量是检索质量的上限」？
  back: 切分、embedding、rerank 都作用在解析产物上。解析若丢了标题层级、把表格揉成一行、把页眉页脚当正文，后面每个环节都在处理垃圾，且很难在检索层救回来。解析的目标不是「读成文本」，而是读成有结构、可定位、可判废的中间表示。
- id: m04-c2
  front: 解析选型的第一条判据是什么？
  back: 有没有文本层。先用 `pdffonts` 看是否嵌入了字体：有嵌入字体说明是电子 PDF，可直接抽取；无字体、文本量极小基本是扫描件，才需要走 OCR。先判这一条，因为它把成本和链路一刀切开。
- id: m04-c3
  front: 扫描件为什么不能「一律全用 OCR」？
  back: OCR 慢且贵（成本翻一倍不止），且会引入识别错字、丢小数字、打乱表格列，直接污染引用锚点。正确做法是只对无文本层的文档走 OCR，OCR 后转成带文本层的 PDF 再回到统一链路，并用置信度与抽样验收兜底。
- id: m04-c4
  front: 解析阶段怎么恢复标题层级？它对下游有什么用？
  back: 按字号聚类（结合加粗），把明显大于正文号的 span 归为标题，按字号映射成 h1/h2/h3，输出带 section_path 的中间表示。下游的结构感知切分、引用锚点都依赖它——解析阶段丢了层级，切分阶段补不回来。
- id: m04-c5
  front: 为什么表格与代码要在解析阶段就单独成块？
  back: 因为它们不可按长度硬切。解析阶段就要识别出来、单独成块（表格序列化成 Markdown/HTML 并保留表头，代码保留缩进与语言标记），并打上 type=table/code，供切分阶段「整块保留、绝不切断」。跨页表格还要按表头续接，失败则标 table_split 告警。
- id: m04-c6
  front: 页眉页脚为什么不能用「出现即删」来清洗？
  back: 若清单里含常见词，会把正文里的同名短语一并删掉。应改用「同一文本在多页重复出现（如 >60% 页）」来判定，并记录命中处数以便回滚。噪声规则要写成有识别方式、有计数的表，不能靠临时手感。
- id: m04-c7
  front: 为什么解析失败要「宁可标记不可用，不要静默丢内容」？
  back: 静默丢内容是解析阶段最危险的失败——检索层永远不知道少了什么，会以低质量检索结果的形式污染整条链路。做法是给每份文档一个 parse_status（ok/low_text/ocr_low_conf/encrypted/failed），让状态驱动动作：要么升级重试，要么隔离告警、人工兜底，绝不产出空块。
- id: m04-c8
  front: 解析抽样验收要抽什么、看什么？
  back: 分层抽样（按源×类型×页数档，总量 ≥30 份）。看四类指标：文本完整度（字符/页 vs 人工）、标题层级还原（章节标题召回）、表格还原（行列可读率）、噪声残留。核心是找缺失而非找错误——错字容易发现，整段丢失不报错，只能靠字符量与人工比对暴露。
