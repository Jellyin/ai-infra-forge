- id: m04-q1
  q: 为什么解析阶段要「宁可标记不可用，不要静默丢内容」？请给出具体的状态机设计。
  a: 因为静默丢内容后，检索层永远不知道少了什么，会以低质量检索结果污染整条链路，且无法回溯。做法是给每份文档一个 parse_status 并让状态驱动动作：ok（正常入库）；low_text（字符/页过低 → 升级到 OCR 重试）；ocr_low_conf（OCR 平均置信度低 → 标 needs_human，不入主库）；encrypted（加密无口令 → 隔离告警）；failed（抛错/零内容 → 隔离告警，绝不产出空块）。判废信号至少含字符/页、乱码率、OCR 置信度（tesseract tsv 的 conf 列）。
- id: m04-q2
  q: 怎么判断一份 PDF 有没有文本层？为什么这是解析选型的第一条判据？
  a: 用 pdffonts 看是否嵌入字体——无嵌入字体、文本量极小基本就是扫描件；也可用 pdftotext 抽取后看字符数是否异常小。它是第一条判据，因为它把成本与链路一刀切开：有文本层直接抽取（便宜快），无文本层才走 OCR（慢且贵、有错字）。若不先判而一律 OCR，则成本翻倍且引入本可避免的识别错误。
- id: m04-q3
  q: 标题层级怎么在解析阶段恢复？它对下游有什么影响？
  a: 按字号聚类（结合加粗）识别标题 span，把明显大于正文号的归为标题，按字号大小映射成 h1/h2/h3，输出带 section_path 的中间表示。下游的结构感知切分（按节切分）与引用锚点都依赖它：解析阶段丢了 section_path，切分阶段无法按节组织、引用也无法定位到章节。所以每个文本块必须携带 doc_id、page、section_path、type。
- id: m04-q4
  q: 页眉页脚清洗为什么不能用「出现即删」？正确的判定与验收方式是什么？
  a: 因为清单里若含常见词，会把正文中同名短语一并删掉。正确判定是「同一文本在多页重复出现（如超过 60% 的页）」才视为页眉页脚，并记录每条规则命中了多少处以支持回滚。验收上，噪声残留应有可测指标（如每份文档页眉页脚残留 ≤1 处），并纳入分层抽样验收表。
