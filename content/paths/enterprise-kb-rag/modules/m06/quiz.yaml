- id: m06-q1
  q: 两个模型输出的向量维度不同，能否把它们的向量放进同一个集合作检索？为什么？
  a: 不能。不同模型的向量不在同一个空间，跨模型计算距离没有意义；维度不同更会直接导致写入失败。换模型必须用新模型重新编码全部文档并重建索引，绝不能新旧向量混装。
- id: m06-q2
  q: 你把向量做了 L2 归一化，集合的相似度度量该选 cosine 还是 dot？说明理由。
  a: 两者等价、都能用。归一化后 dot 与 cosine 给出的排序完全一致（L2 距离也与它们单调对应），所以可以用 dot 走更快的路径。反过来若未归一化，dot 会被向量模长污染，这时应显式用 cosine。
- id: m06-q3
  q: 用 Qdrant 建 HNSW 索引时，m 与 ef_construct 分别影响什么？想在线提升召回该动哪个参数？
  a: m 是每个节点的连边数，越大召回与内存越高、构建越慢；ef_construct 是建索引时的候选队列长度，越大索引质量越高、构建越慢，但不影响查询速度。想在线提升召回应调查询期的 ef（Qdrant 的 hnsw_ef），它不改索引，只增加单次查询的召回与延迟。
- id: m06-q4
  q: 团队已有 Postgres、语料约 200 万块，你会直接上 Milvus 吗？给出判断依据。
  a: 先不急着上。200 万块在 pgvector 的可承受范围内（到千万级才明显吃力），复用现有 Postgres 能省下一整套运维；先用数据验证 pgvector + hnsw 的召回与延迟是否达标。只有当数据到亿级、或需要独立扩缩容与多副本时，Milvus 的分布式优势才值得付出运维代价。
