id: m13
title: 评测集构建：从真实问题到黄金集
goal: 评测集的质量决定你能改进的上限
order: 13
track: 阶段 5 · 评测体系
read: 20
lab: 35
concepts:
  - 问题来源：真实提问日志、业务专家、竞品对照
  - 问题分类：事实/流程/多跳/不可答
  - 标注口径：什么算「答对」，一致性与仲裁
  - 难例与边界：不可答、跨文档、权限受限
  - 黄金集规模与覆盖度的平衡
  - 防污染：评测集不能进入训练/提示词
checklist:
  - 能产出一份覆盖四类问题的黄金集并说明标注口径
  - 能设计标注一致性检查与仲裁流程
  - 能说明为什么必须包含「不可答」类问题
  - 能给出评测集规模建议并说明依据
  - 能建立评测集的版本管理与防污染纪律
