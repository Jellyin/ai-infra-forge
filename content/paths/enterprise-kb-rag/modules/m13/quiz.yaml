- id: m13-q1
  q: 为什么「什么算答对」必须分类型定口径，而不能用一句话概括？
  a: 因为「答对=回答正确」不可操作，两个陌生人无法据此独立复现判断，一致率必然很低。事实题看数值/编号是否精确一致，流程题看步骤集合与顺序，多跳题看每条子结论与最终结论，不可答题看是否拒答——四类判据不同，必须分别写清并能被他人复现。
- id: m13-q2
  q: 一个 300 题的黄金集全由事实题组成、且没有不可答题，会带来什么后果？
  a: 两个后果。一是覆盖面失真，流程、多跳、权限受限等场景完全没有度量，系统在这些场景退化也看不出来。二是测不出拒答行为——没有不可答题，就无法区分「老老实实拒答」和「永远乱答」，漏拒率与误拒率都无从计算。评测集分布应当逼近线上分布，四类都要有。
- id: m13-q3
  q: 黄金集里漏标 gold_doc_ids 会怎样？为什么不能只标 gold_answer？
  a: 检索侧指标全部失效——recall@k 的分母来自 gold_doc_ids，没有它就算不出召回、MRR、nDCG。只能测生成侧。而检索是生成的上游，检索错了生成再准也没用。所以标注必须到「文档/章节」级，且与生成侧标注同等对待。
- id: m13-q4
  q: 两人标注一致率 κ=0.45，你会先做什么？
  a: 先停下来改口径，而不是继续标更多题。κ 低说明 rubric 本身不清楚，即标注者对「什么算答对」理解不一致。应先抽出分歧集中的题型，把判据写得更可操作（例如明确「数字必须精确一致」「流程顺序错误算错」），必要时调成二值，再重标并复算 κ；κ 达标后才扩量。
