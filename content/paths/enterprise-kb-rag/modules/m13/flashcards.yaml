- id: m13-c1
  front: 为什么说「评测集的质量决定你能改进的上限」？
  back: 没有黄金集，「变好了」不可证伪也不可复现，评审会上只能各说各话。评测集还是长期回归测试而非一次性验收——每次改提示词/换模型/调切分都要重跑同一套题。口径错的评测集会优化指标而不优化体验。
- id: m13-c2
  front: 评测问题的三个来源各有什么偏差？
  back: 真实提问日志分布最真但要脱敏筛选；业务专家构造能覆盖冷门重要问题但有「专家视角」偏差、偏书面；竞品对照能探边界但有版权与可比性问题。常见配比是日志 50–70%、专家 20–40%、竞品 ≤10%。
- id: m13-c3
  front: 黄金集里 gold_doc_ids 字段有什么用？
  back: 它是检索侧指标的唯一标注来源——recall@k 的分母就来自它。缺了 gold_doc_ids 的题只能测生成、测不了检索。所以标注必须到「文档/章节」级，不能只给答案。
- id: m13-c4
  front: 为什么黄金集必须包含「不可答」类问题？
  back: 因为一个永远乱答的系统在纯可答题集上也能拿高分；没有不可答题就度量不出拒答行为。不可答题是检验「证据不足即拒答」的唯一手段，建议占 15–25%，标 must_refuse=true 且 gold_answer 为 null。
- id: m13-c5
  front: 标注一致性怎么测？κ 低应该怎么办？
  back: 两人独立标同批题，算 Cohen's κ（两标注者、定类变量）。κ<0.6 说明口径本身不清楚，应先回去改 rubric 再标，而不是硬标；分歧交第三人仲裁，仲裁结论要回写进口径文档。
- id: m13-c6
  front: 黄金集规模依据什么定，而不是拍脑袋？
  back: 依据指标分辨率。二值指标标准误约等于 sqrt(p(1-p)/n)，p≈0.85 时 n=200 的 95%CI 约 ±5pp。想稳定分辨约 5pp 的变化全量约 200 题；若要在某类子集上单独看指标，该类自身也要 100–200 题，总量常落在 300–500，并留 20% 作 held-out。
- id: m13-c7
  front: 评测集的防污染纪律具体禁止什么？（注意一个容易搞混的点）
  back: 禁止评测集的「问题与标准答案」进入训练/微调数据、few-shot 示例、RAG 提示词示例、语义缓存、以及以问答对形态被索引进语料库的 FAQ 文档。容易搞混的是——评测题引用的源文档必须在语料库里（否则检索不到），泄漏指的是问答对本身进了索引或提示词。
- id: m13-c8
  front: 评测集为什么「只加不删」？删题要满足什么条件？
  back: 因为「模型老在这题上错就删题」是过拟合评测集，会让指标虚假上升。只有「题本身有错」才能删，且必须留下删除记录。新增题可以随时加，但 gold 必须重新人工标注，不能拿模型输出当 gold。
