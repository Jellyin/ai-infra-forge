- id: m14-c1
  front: recall@k 的分母是什么？为什么不能写成 k？
  back: 分母是黄金集里该问题标注的所有相关文档数 |Rel|，不随 k 变化——k 只决定分子里能装下多少相关项，所以 recall@k 随 k 单调不减。把分母写成 k 就变成 precision@k，或写成「实际返回条数」会让 recall 恒等于 1，是这一节最常见的错。
- id: m14-c2
  front: MRR 衡量什么？为什么它不关心后面还有没有相关结果？
  back: MRR 等于各题「第一个相关结果排名倒数」的平均值。它只奖励第一个相关结果尽早出现，完全不看后面是否还召回其他相关文档，所以「MRR 高、recall 低」是常见组合。它适合只有一个正确答案的事实查询，不适合需要多处证据的多跳。
- id: m14-c3
  front: nDCG 的增益与折损怎么定义？分母为什么用 IDCG？
  back: 增益 g_i = 2^{rel_i} − 1（指数放大高相关度的价值），折损 d_i = 1/log2(i+1)（位置越靠后折损越大，第 10 位只剩约 0.29）。DCG@k = Σ g_i·d_i。分母 IDCG@k 是理想排序（rel 从高到低、同样截断到 k）的 DCG，归一化后每题满分都是 1，才能跨问题求平均与比较，所以不能拿原始 DCG 相加比系统。
- id: m14-c4
  front: 忠实度（faithfulness）与正确性有何区别？各自能定位什么病灶？
  back: 正确性比较答案与标准答案是否一致；忠实度只问「答案的每条事实陈述能否由检索证据推出」，不与标准答案比较。忠实度低一定是幻觉；忠实度 100% 但正确性低，说明证据本身有问题（旧版/错文档），病灶在检索而不在生成。
- id: m14-c5
  front: 引用覆盖率与引用正确率有什么区别？
  back: 覆盖率问「有没有引」（带有效引用的陈述数 / 总陈述数），正确率问「引得对不对」（引用确实支持该陈述的比例，即幻觉引用的反向）。覆盖率 100% 加正确率 30% 完全可能——每句都挂了引用但引的是不支持的块。报表还要写清覆盖率是陈述级还是回答级，两者数量级常差很多。
- id: m14-c6
  front: 拒绝率、误拒率、漏拒率三者的分母分别是什么？
  back: 拒绝率分母是全部提问，是个无法判好坏的聚合值；误拒率分母是可答子集（该答却拒，伤体验）；漏拒率分母是不可答子集（该拒却答，伤信任）。拒绝率高可能是好事也可能是坏事，只有在子集上算才知道。把拒绝率当成误拒率是最常见的错误。
- id: m14-c7
  front: LLM-as-judge 有哪些已知偏差，怎么缓解？
  back: 位置偏差（偏好第一个，缓解靠交换 A/B 位置各评一次或改用单答案打分）、长度偏差（偏好更长，rubric 声明简洁不加分或做长度归一）、自偏好（偏好同族输出，换不同族判官或双判官投票）、不可复现（temperature>0，改 temperature=0 并重复 N 次取一致率）。此外要冻结 rubric 版本、跑锚点题监测校准漂移。
- id: m14-c8
  front: CI 回归门禁里「硬门槛」「相对门槛」「噪声带」各管什么？
  back: 硬门槛是绝对下限（如 faithfulness ≥ 0.90），不满足直接失败；相对门槛管退步（如 recall@10 比基线低超过 2pp 就阻断）；噪声带把小于约 1pp 的波动视为抖动不判退步，避免 judge 抖动让 CI 天天红。三者要同时有，否则要么漏放退步、要么误伤。
