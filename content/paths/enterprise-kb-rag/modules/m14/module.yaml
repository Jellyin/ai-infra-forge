id: m14
title: 自动评测与回归门禁
goal: 把「感觉变好了」变成「指标变好了」
order: 14
track: 阶段 5 · 评测体系
read: 22
lab: 40
concepts:
  - 检索侧指标：召回@k、MRR、nDCG
  - 生成侧指标：正确性、忠实度（faithfulness）、引用覆盖率
  - LLM-as-judge 的可靠性与它的边界（偏差、可复现性）
  - 人工抽检与自动评测的配比
  - 把评测接进 CI 作为回归门禁（退步即阻断）
  - 评测结果的归档与对比看板
checklist:
  - 能搭起检索+生成两套自动评测并跑出数字
  - 能说明 LLM-as-judge 在什么情况下不可信
  - 能把评测接进 CI 并设置阻断阈值
  - 能设计一次改动的 A/B 评测与结论口径
  - 能解释「指标涨了但用户更不满意」的可能原因
