- id: m14-q1
  q: 写出 recall@10 与 precision@10 的定义，并说明二者分母的区别。
  a: recall@10 = |Top-10 ∩ Rel| / |Rel|，分母是该问题标注的所有相关文档数，不随 k 变化；precision@10 = |Top-10 ∩ Rel| / 10，分母是 k。k 调大时 recall 通常升、precision 通常降，所以两个要一起看，只报一个会误导。
- id: m14-q2
  q: 一次改动让离线指标全涨、线上点踩率也涨了，列出至少三条可能原因。
  a: 一是 judge 的长度偏差奖励了更啰嗦的答案，用户却嫌烦；二是护栏指标被忽略——答案变长导致延迟恶化（TTFT/端到端上涨）；三是子群退化被全局均值掩盖，例如多跳类明显变差但被易题拉高；四是评测集不代表线上分布，线上出问题的那类题没被覆盖；五是拒答阈值被间接调松，不可答题漏拒率上升。核心是「口径错位 + 护栏失守 + 子群被平均掩盖 + 评测集分布不符」的组合。
- id: m14-q3
  q: LLM-as-judge 在什么情况下不可信？怎么校准？
  a: 当存在位置偏差、长度偏差、自偏好、temperature 导致的不可复现，以及 rubric/模型版本变化带来的校准漂移时都不可信。校准方式是把判定与人工标注子集对齐——抽 50 至 100 题人工标一遍，算 judge 与人的一致率（accuracy / Cohen's κ / Spearman），κ 不达标（如低于 0.6）就不能用于门禁；同时每次评测先跑锚点题确认 judge 没漂移。它适合相对比较与粗筛，不适合单独作为发布门禁的绝对分数。
- id: m14-q4
  q: CI 门禁的阈值该怎么设？为什么必须有噪声带？
  a: 阈值分两类——硬门槛管绝对下限（faithfulness ≥ 0.90 之类），相对门槛管相对基线的退步容差（如 recall@10 允许最多降 2pp）。必须同时设噪声带（把约 1pp 以内的波动视为抖动不判退步），否则 judge 的不可复现会让 CI 频繁误报，最后没人看红叉。此外建议先「只报告不阻断」跑几次，记录正常波动幅度，再据此设阈值并打开阻断。
