- id: m18-q1
  q: 一次慢请求总耗时 9.1s，其中 queue_wait 5.6s、decode 2.6s、检索 0.25s。你会先查什么？为什么不该先加副本？
  a: 先查排队相关的槽位与调度参数（max_num_seqs、单请求占用时长、是否有长上下文请求涌入、是否上了更大模型的实验开关）。因为 queue_wait 占 62% 说明瓶颈是排队而非算力，此时 GPU 利用率大概率没打满，加副本只是复制同一个瓶颈、成本翻倍收益有限。应先调调度把 queue_wait 压下去，利用率打满后再谈扩容。
- id: m18-q2
  q: 账单环比翻倍，但 completion_tokens 均值几乎没变、向量库费用也没动，GPU 卡时却涨了 75%。怎么归因？
  a: '既然输出没变、向量库没动，涨的是 GPU 卡时，就要往「输入变长 + 命中率下降 + 模型变大」三条线查：top_k 6→12 让 prompt_tokens 从 1800 涨到 2100，拉长 prefill 与 KV 占用；缓存命中率 38%→12% 使大量请求回源打 GPU；更大模型的实验开关抬高单位卡时消耗。三者叠加解释卡时上涨。优化方向是分级模型、回落 top_k、修复缓存失配。'
- id: m18-q3
  q: 如何做容量规划并说明峰值余量？为什么不能只算 QPS？
  a: '先把峰值 QPS 换算成并发槽位（峰值 QPS × 单请求平均占用时长），再用显存推导并发上限（可用显存减权重占用后除以单请求上下文乘 KV 每 token 占用），两者之比即峰值余量，目标 ≥1.5。只看 QPS 不够，因为并发能否落地受显存硬约束——槽位塞不进显存，QPS 再低也跑不动。'
- id: m18-q4
  q: 告警分级的判据是什么？哪些属于必须半夜叫人的 P0？
  a: '唯一判据是它是否直接影响用户拿到答案。P0（半夜叫人、先止损）：全站错误率 >5% 持续 5min、TTFT P95 超 SLO 两倍持续 10min、拒答率突增。只影响成本或趋势的（单租户配额打满、缓存命中率骤降、单次成本日环比 >30%）降到 P1 值班群，慢查询趋势降到 P2。每条告警都要写明谁在何时做什么，否则不算告警。'
