- id: m18-c1
  front: 为什么推理延迟必须拆成 queue_wait / prefill / decode 三段？
  back: 因为「慢」的根因不同，动作完全不同：queue_wait 长说明排队（槽位/调度问题），decode 长说明生成本身慢（模型大小/上下文长）。不拆开看，排队和生成会永远互相甩锅，导致把「加副本」当成万能药。
- id: m18-c2
  front: 质量、延迟、成本三张看板为什么要同屏？
  back: 因为优化任意一个都会拉扯另外两个——提 top_k 提质量但拉高成本与延迟，加大模型降延迟风险但涨成本。分开看就只能在事后解释代价；同屏才能当场看到权衡。
- id: m18-c3
  front: 自建 vLLM 的单次成本怎么算？为什么不照搬按量 API 的 token 算法？
  back: '自建的成本大头是 GPU 时间，不是 token。应按「GPU 卡时单价 × 卡数 × 时长 / 该时段完成请求数」摊销，再加向量库检索与存储摊销。token 单价算法只适用于回退到按量 API 的路径。'
- id: m18-c4
  front: 成本归因到租户时，向量库分摊要注意什么？
  back: '口径必须二选一写死：按索引体积分摊，或按请求占比分摊，不要混用。混用会让同一租户两次算出的成本不一致，账单无法解释。GPU 部分按「该租户占用的 GPU 秒 × 卡时单价」归因。'
- id: m18-c5
  front: 容量规划为什么是「并发槽位 vs 显存」而不是直接算 QPS？
  back: '因为并发能否落地受显存硬约束：并发上限 ≈（可用显存 − 权重占用）/（单请求上下文 × KV 每 token 占用）。QPS 再高，槽位塞不进显存也跑不起来。负载是 QPS 换算成并发槽位后再与显存推导的上限比较。'
- id: m18-c6
  front: 告警分级的唯一判据是什么？
  back: 它会不会直接影响用户拿到答案。会 → P0（半夜叫人，先止损）；只是变贵或趋势不好 → P1/P2（工作时间内处理）。任何没写「谁在何时做什么」的告警都还不算告警。
- id: m18-c7
  front: 质量信号有哪些？缺位会带来什么后果？
  back: '拒答率、引用覆盖率、用户反馈分、缓存误命中申诉数。缺位时优化就是盲飞——只看延迟和成本会把「拒答一切」当成又快又省的胜利，实际是把系统优化成了废品。'
- id: m18-c8
  front: 峰值余量是什么，留多少、为什么？
  back: '峰值余量 = 并发上限 / 峰值并发需求，建议 ≥1.5。它保证峰值流量或单请求占用变长时还有空间，不留余量就意味着第一个促销日或第一次长上下文涌入即事故。'
