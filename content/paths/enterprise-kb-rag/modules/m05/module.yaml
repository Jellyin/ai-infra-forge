id: m05
title: 切分策略：粒度、重叠与父子块
goal: 切分是检索召回与生成可读性的共同约束
order: 5
track: 阶段 2 · 数据与索引
read: 20
lab: 35
concepts:
  - 固定长度 / 递归 / 结构感知 / 语义切分的适用与代价
  - overlap 的作用与副作用
  - 父子块（small-to-big）：小块检索、大块生成
  - 表格与代码的不可切分性
  - 块大小与 embedding 模型上下文的关系
  - 切分参数的评测方法（不要凭感觉调）
checklist:
  - 能为三类文档各选一种切分策略并说明理由
  - 能实现父子块并解释它解决了什么问题
  - 能设计切分参数的对比实验（控制变量）
  - 能说明 overlap 过大带来的代价
  - 能指出哪些内容类型绝不能按长度硬切
