- id: m05-q1
  q: 为什么切分要「先结构、后长度」？它依赖什么前提？
  a: 因为单靠长度切分无视文档层级与语义边界，会把一个节切碎、把表格/代码切断；单靠结构切分又可能某节过长、单块超上限。两段式：先按标题切出带层级的节（层级进 metadata，供引用与过滤），再在节内套递归切分控制单块上限，兼顾层级与粒度。前提是 m04 解析阶段已恢复出 section_path——否则没有结构可依。
- id: m05-q2
  q: overlap 过大为什么有害？给你的经验区间与验证方法。
  a: overlap 过大：token 重复计入使索引与 embedding 成本上升；产生近重复块占满 top-k、挤掉真正不同的证据；拼装时重复文本浪费生成预算；黄金集里近重复块让 recall 虚高。经验区间是 chunk_size 的 10%–20%，超过约 25% 通常得不偿失。验证方法：固定其余参数、只扫 overlap（0/10%/20%/40%），记录 recall@5 与近重复率——看增益是否值得重复代价。
- id: m05-q3
  q: 父子块（small-to-big）的存储结构与检索流程是什么？收益与成本各是什么？
  a: 结构：子块（小，~200–300 token）入向量库用于检索，payload 带 parent_id 指回父块；父块（大，~1000–2000 token）只存不检索，放 KV/关系表/对象存储。流程：召回子块 top_k（可放宽到 ~20）→ 去重收集 parent_id → 批量取回父块 → 按父块再排一次 → 用父块文本拼上下文。收益：检索精度（小块）与生成完整性（大块）兼得。成本：多一跳查询（延迟）、文本存两份（存储）、父块数量必须按 token 预算封顶否则超窗。
- id: m05-q4
  q: 设计切分参数的对比实验时，怎么写才能得到可信结论？
  a: ①先建黄金集 (query, 相关块) 对；②指标用 recall@k（切分最直接受害者是召回）、MRR/context_precision 与近重复率（overlap 过大的报警器）；③控制变量：固定 embedding、检索器、k 与语料，一次只改一个参数，分三组分别扫 chunk_size、overlap、切分策略；④每格记录块数、recall@5、近重复率、平均块长、索引体积；⑤选型规则：满足召回目标前提下取块数最少（最便宜）的那组，并盯住近重复率。这样「为什么是这个参数」才有数字可答。
