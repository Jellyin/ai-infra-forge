- id: m05-c1
  front: 为什么说「切分是给检索切的，不是给入库切的」？
  back: 块大小不是「好切」的那个，而是在真实提问分布上召回最好的那个。切分同时约束召回（块要小、语义集中，向量才对得上问题）与可读性（块要完整，答案才读得懂），两者方向相反，取舍要以检索指标为准。
- id: m05-c2
  front: 四种切分策略各适合什么、代价是什么？
  back: 固定长度适合结构极乱的流水文本，但会腰斩句子；递归切分是结构一般正文的主力，但要调参；结构感知（按标题）适合有清晰层级的文档，依赖解析阶段恢复的 section_path，过长节需二次切；语义切分适合无标题长论述，但需额外模型、成本高、收益不稳定。
- id: m05-c3
  front: 为什么推荐「先结构、后长度」的两段式切分？
  back: 先按标题切出带层级的节（层级进 metadata，供引用与过滤），再在节内套递归切分控制单块上限。这样既保住文档层级，又限制粒度，兼顾结构感知与块大小控制。前提是 m04 解析阶段已恢复出 section_path。
- id: m05-c4
  front: overlap 的作用是什么？过大会带来什么代价？
  back: 作用是防止一个事实正好落在块边界、被两边各切一半导致谁都召回不全。过大会：token 重复计入使索引与 embedding 成本上升；产生近重复块占满 top-k、挤掉真正不同的证据；拼装时重复文本浪费生成预算；让黄金集里近重复块造成 recall 虚高。经验区间为 chunk_size 的 10%–20%。
- id: m05-c5
  front: 父子块（small-to-big）解决什么问题？流程与成本是什么？
  back: 解决「小块好检索但信息不全、大块完整但向量被稀释」的矛盾。流程：召回小子块（可放宽 top_k）→ 去重收集 parent_id → 批量取回父块 → 按父块再排一次 → 用父块文本拼上下文。收益是检索精度与生成完整性兼得；成本是子到父多一跳查询（延迟）、文本存两份（存储）、父块数量要按 token 预算封顶。
- id: m05-c6
  front: 为什么表格与代码绝不能按长度硬切？
  back: 表格被截断后表头与数据分离，检索读不出「哪列对应哪个值」；代码被切断后函数不完整、无法理解。规则是整块保留为独立 chunk（type=table/code，atomic=true，跳过长度切分）；确实过大时按行/按函数拆，但每个子块要重复表头或补齐上下文。
- id: m05-c7
  front: 块大小和 embedding 模型上下文是什么关系？
  back: embedding 模型有最大输入 token 数，块超过上限会被静默截断，尾部内容不入向量、对检索不可见。所以 chunk_size 要在嵌入模型自己的 tokenizer 度量下、留出余量地小于模型上限。中文尤需注意：多数中文 tokenizer 下约 1 字 ≈ 1 token，按字符设的 800 可能已超 512 上限而被静默截断。
- id: m05-c8
  front: 怎么用控制变量实验给切分参数定值？
  back: 先建黄金集 (query, 相关块) 对；指标用 recall@k、MRR/context_precision 与近重复率。固定 embedding/检索器/k/语料，一次只改一个参数：分三组分别扫 chunk_size、overlap、切分策略，每格记录块数、recall@5、近重复率、平均块长、索引体积。选型规则：满足召回目标的前提下取块数最少（最便宜）的那组，并盯住近重复率。
