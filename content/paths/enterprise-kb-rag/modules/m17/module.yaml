id: m17
title: 服务化与 API 设计
goal: 从脚本到服务：并发、缓存、限流
order: 17
track: 阶段 6 · 平台化
read: 20
lab: 40
concepts:
  - 接口形态：问答/流式/引用返回/会话管理
  - 并发模型与推理侧批处理（continuous batching 的影响）
  - 语义缓存：收益、失效与误命中风险
  - 限流、配额与租户级隔离（一个租户不能拖垮全站）
  - 失败降级：检索失败/生成超时/模型不可用时的行为
  - 版本化：接口与提示词都要能回滚
checklist:
  - 能设计出问答服务的接口契约
  - 能说明推理并发与延迟的关系并给出配置
  - 能评估语义缓存的收益与风险并给出失效策略
  - 能实现租户级限流并验证隔离效果
  - 能定义各环节失败时的降级行为
