- id: m17-c1
  front: 为什么接口契约要先于服务代码冻结？
  back: 因为脚本和服务最大的区别不是并发，而是「接口一旦发布就难改」——客户端已经在用，改字段就是破坏性变更。先定契约能逼你把 tenant_id、citations、usage、trace_id 这些「后面很难补」的字段一次设计对，避免上线后返工。
- id: m17-c2
  front: 什么情况下该加副本、什么情况下加副本是浪费？
  back: 只有当「GPU 利用率已接近打满 且 队列等待高」时才该加副本。若 GPU 利用率明显偏低而队列等待高，瓶颈是调度/参数（如 max_num_seqs 太小），加副本只是把同一个瓶颈复制一份，成本翻倍收益有限。另注意副本间不共享 KV cache，同一问题打到不同副本前缀复用收益归零。
- id: m17-c3
  front: 语义缓存的键必须包含哪些维度？漏掉哪一个最危险？
  back: '至少包含 normalize(query)、tenant_id、acl_scope（可访问文档集合指纹）、model_version、prompt_version、index_snapshot_id。漏掉 acl_scope 或 tenant_id 会跨租户/跨权限复用答案——这不是「答错」而是数据泄漏，最危险。'
- id: m17-c4
  front: 语义缓存的三类高风险误命中是什么？（阈值调高也挡不住）
  back: '① 意图相反：否定、撤回、加急（「如何申请延期」vs「如何撤销延期」）；② 时效敏感：问「当前价格」「最新版本」这类随时变的内容；③ 权限不同但文本相同：只能靠键里的 acl_scope 隔离，与阈值无关。'
- id: m17-c5
  front: 语义缓存失效的三道防线分别是什么？
  back: '① 事件驱动：文档更新时反查「哪些缓存项引用了它」并失效，为此要维护 cache_key → 引用 doc_ids 的反向索引，否则只能全量清空；② TTL 兜底（如 1h），作为漏掉失效事件的第二道网；③ 版本升维：model/prompt/index 版本进键，升级即自然全失效。'
- id: m17-c6
  front: 为什么限流要用 tpm 而不只是 rpm？
  back: 因为一次长上下文（如 8k token）的消耗抵得上几十次短问答，只看每分钟请求数会低估资源占用，长请求照样能把推理后端压垮。tpm（tokens/min）才能反映真实负载，需与 rpm、concurrent 一起用。
- id: m17-c7
  front: 流式响应为什么要先吐 citation 事件再吐 token？
  back: 让用户先看到证据、再看到答案，比反过来更可信；也能在「引错文档、答到一半发现不对」时及时中止，避免生成一大段基于错误引用的内容。
- id: m17-c8
  front: 各环节失败时的默认降级行为是什么？
  back: '向量库超时→只走关键词/BM25 检索并标注「检索降级」；生成超时→返回已检索到的 Top 片段+提示（给证据不给总结）；模型不可用→切备用小模型或返回 503+Retry-After（明确告知，不假装成功）；缓存不可用→旁路走全链路，用户无感但延迟升高。'
