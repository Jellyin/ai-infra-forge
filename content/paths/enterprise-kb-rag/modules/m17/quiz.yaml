- id: m17-q1
  q: 为什么问答服务的接口契约里必须包含 citations[]、usage 和 trace_id？少了会怎样？
  a: 'citations[] 是「给人回溯证据」的能力，企业知识库的中高代价场景没它无法验收；usage 是成本归因的数据源，没有它后面无法算单次成本与租户账单；trace_id 是全链路追踪的唯一入口，后补等于把观测层重做。三者在接口发布后就很难加，所以必须一次设计对。'
- id: m17-q2
  q: 压测发现并发升高时 TTFT 几乎翻三倍，但 GPU 利用率仍只有 60%，此时该加副本吗？该怎么做？
  a: 不该直接加副本。利用率没打满说明瓶颈不是算力，而是队列等待（max_num_seqs 太小或调度参数不合理）。应先调大 max_num_seqs、开启 enable_prefix_caching，把队列等待压下去再看利用率；只有当利用率接近打满且队列等待仍高时，加副本才有意义。
- id: m17-q3
  q: 有人提议加一个「语义相似度 ≥ 0.85 就返回缓存答案」的语义缓存，你会追问哪三个问题？
  a: '① 键里有没有 tenant_id 与 acl_scope——没有就会跨租户/跨权限泄漏；② 有没有 index_snapshot_id/model_version/prompt_version——没有则文档更新或换模型后仍返回旧答案；③ 失效由谁触发、有没有 cache_key→doc_ids 反向索引与 TTL 兜底——否则文档更新后缓存不会失效。另外要问阈值 0.85 下意图相反的问法（否定/撤回）会不会误命中。'
- id: m17-q4
  q: 如何验证租户级限流真的做到了隔离？验收点是什么？
  a: '给两个租户各配 rpm/concurrent，用脚本让租户 A 打到超限（收到 429+Retry-After），同时观察租户 B。验收点是：A 被限流期间，B 的成功率与 P95 延迟不恶化。若 B 也变慢，说明限流只做了全局维度、没有按租户排队或隔离，需要补 tenant/user 维度并引入按租户的公平排队。'
