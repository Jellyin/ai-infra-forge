- id: m11-q1
  q: 引用锚点粒度（块/段/页/字符区间）各自的取舍是什么？本项目为什么选双锚点？
  a: 块（chunk_id）精度中、随文档更新较稳定、成本低；段（标题路径）可读性好、稳定性中；页粒度粗、PDF 重排即失效；字符区间最精确可高亮、但随解析漂移、成本高。本项目选双锚点——机器侧用 chunk_id + 块内字符区间保证可回溯与高亮，人侧用标题路径 + 页码保证用户能跳过去。只用一种要么用户不知跳哪、要么程序无法精确校验。字符区间必须相对块而非整篇，否则上游一变全失效。
- id: m11-q2
  q: 生成后校验的骨架要实现哪几步？「引用是否支持结论」有哪些实现方式？
  a: 骨架四步：① 越界引用集合检查（编号 ∈ 证据映射表）；② 逐句检查含事实的句子是否有引用、引用是否支持该句；③ 无引用断言标记；④ 权限一致性（被引用块 ∈ 授权集合）。「是否支持」三档实现：词面重叠 + 数字/实体对齐（便宜、抓数字幻觉）、NLI 蕴含小模型（较准）、LLM-as-judge（最准最贵）。推荐在线用词面对齐、离线回归用蕴含判定/判官。
- id: m11-q3
  q: 怎么保证引用不会泄露无权限内容？为什么三道防线缺一不可？
  a: 引用链接本身可能成为泄露通道，正文合规也没用。三道防线：① 证据集即授权集，进入提示词的证据就是权限过滤后的集合（不要先生成后过滤引用）；② 校验期复核被引用块属于授权集合；③ 展示期按当前用户权限重新鉴权再返回原文，防止「提问时有权限、点击时权限已撤销」的漂移。任何「生成时知道、展示时不知道」的权限差异都是泄露风险。
- id: m11-q4
  q: 引用覆盖率作为回归指标，定义要注意什么？为什么不能单看它？
  a: 定义要写死并可计算，例如「带至少一个通过全部校验的有效引用的结论句数 / 结论句总数」，否则各人理解不一致无法回归。不能单看覆盖率：刷高覆盖率可能只是模型学会到处挂无关引用，因此必须与「不支持引用率」和「幻觉引用条数」一起看，并共同进 CI 门禁；覆盖率下降即视为回归失败，哪怕答案读起来更流畅。
