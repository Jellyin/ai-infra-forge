id: m11
title: 引用与溯源：把答案锚回原文
goal: 没有引用的大模型问答，在企业里不能用
order: 11
track: 阶段 4 · 生成与可信引用
read: 20
lab: 35
concepts:
  - 引用锚点：块/段/页码/字符区间——选哪一级以及为什么
  - 生成后校验：引用是否真的支持该结论
  - 「幻觉引用」的检测（引用了不存在的块 / 引用与结论不符）
  - 权限过滤后的引用一致性（不能引用无权限的内容）
  - 前端呈现：点击引用跳到原文位置
  - 引用覆盖率作为可测指标
checklist:
  - 能实现从答案到原文的可点击溯源
  - 能检测并统计幻觉引用
  - 能保证引用不会泄露无权限内容
  - 能把引用覆盖率做成回归指标
  - 能说明引用锚点粒度选择的取舍
