- id: m11-c1
  front: 为什么「有引用标记」不等于「有依据」？
  back: 模型可以编一个不存在的编号（越界引用），也可以引用一个真实存在、却根本不支持该结论的块（引用与结论不符）。前者好抓，后者更隐蔽也更像真的。因此「给出引用」和「校验引用」必须是两件事，缺了后者引用就只是装饰。
- id: m11-c2
  front: 引用锚点有哪些粒度？本项目为什么选「双锚点」？
  back: 粒度有块（chunk_id）、段（标题路径/段序）、页（页码）、字符区间。块精度中但稳定、页粗且随 PDF 重排漂移、字符区间最细但最易随解析漂移。本项目双锚点：机器侧用 chunk_id + 块内字符区间（可回溯可高亮），人侧用标题路径 + 页码（用户能自己跳过去）。只用其一都不够。
- id: m11-c3
  front: 为什么字符区间要「相对块」而不是相对整篇文档？
  back: 整篇文档级的 offset 会随解析器版本、切分参数变化而整体漂移，锚点很快失效；相对块的 offset 只依赖块内容，只要块还在，区间就稳定。锚点稳定性的根在「依赖最小的、不随上游变动的坐标」。
- id: m11-c4
  front: 生成后校验骨架要检出哪三类问题？
  back: ① 越界引用（`[[n]]` 的 n 不在证据集内，即引用了不存在的块）；② 不支持结论（引用存在但内容不支持该句）；③ 无引用断言（含事实的句子没有引用）。前两类之外还要加权限一致性检查：被引用块必须属于授权集合。
- id: m11-c5
  front: 判定「引用是否支持结论」有哪些实现档位，怎么选？
  back: 三档：① 词面重叠 + 数字/实体对齐（便宜，抓数字幻觉，抓不住改写）；② NLI 蕴含小模型（较准）；③ LLM-as-judge（最准但贵、有延迟）。推荐组合：在线用 ① 拦硬伤，离线回归用 ②/③ 发现软性不支持。判官别放在在线关键路径。
- id: m11-c6
  front: 「幻觉引用」有哪两类？各自怎么检测？
  back: ① 引用了不存在的块（如 `[[7]]` 而证据只到 `[5]`）——用编号 ∈ 证据映射表的集合检查；② 引用与结论不符（块真实存在但不支持该句）——用蕴含判定或词面+数字对齐。只查第一类不够，第二类危害更大。两类都要做成可统计指标并进门禁。
- id: m11-c7
  front: 引用为什么会成为权限泄露的通道？三道防线是什么？
  back: 即使正文合规，一个指向无权限文档的引用链接本身就是泄露。三道防线：① 证据集即授权集（进提示词的证据就是权限过滤后的集合，不要先生成再过滤引用）；② 校验期复核被引用块 ∈ 授权集合；③ 展示期按当前用户权限重新鉴权再决定是否返回原文（防「提问时有权、点击时无权」的漂移）。
- id: m11-c8
  front: 引用覆盖率怎么定义才算「可回归」？为什么不能只看覆盖率？
  back: 定义要写死，例如「带至少一个通过全部校验的有效引用的结论句数 / 结论句总数」。必须与「不支持率」一起看：覆盖率刷高可能只是模型学会到处挂引用，不代表有依据。覆盖率下降应视为回归失败，哪怕答案看起来更流畅。
