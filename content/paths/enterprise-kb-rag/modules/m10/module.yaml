id: m10
title: 生成链路：上下文拼装与拒答
goal: 把检索结果变成可信回答，而不是文字接龙
order: 10
track: 阶段 4 · 生成与可信引用
read: 20
lab: 35
concepts:
  - 提示词结构：角色、约束、证据、输出格式
  - 上下文拼装：块顺序、去重、长度预算与截断策略
  - 拒答：证据不足时必须说不知道，而不是编
  - 引用格式约束（在提示词层面强制）
  - 流式输出与会话状态的最小必要记忆
  - 模型选型：质量/延迟/显存成本三角
checklist:
  - 能设计一份可复用的提示词模板并说明每部分作用
  - 能给出上下文长度预算与截断策略
  - 能实现「证据不足即拒答」并测出误拒率
  - 能说明会话记忆保留什么、丢弃什么
  - 能为本项目选出生成模型并给出成本估算
