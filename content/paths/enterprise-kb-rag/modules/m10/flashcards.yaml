- id: m10-c1
  front: 一份可复用的生成提示词模板必须包含哪四段？各起什么作用？
  back: 角色（限定身份与知识边界）、硬约束（把「不许编」写成可检查条款）、证据（唯一事实来源，附带引用所需元数据）、输出格式（让 `[[n]]` 与拒答标记可被程序解析）。格式即接口——格式模糊，生成后校验就无从谈起。
- id: m10-c2
  front: 上下文拼装时「块顺序」为什么要特别设计，而不是按分数降序？
  back: 模型对上下文开头与结尾更敏感，中间易被忽略。做法是把最相关的 1–2 块放开头、次相关放结尾、弱相关沉中间。简单按分数降序排，等于把关键证据塞进了易被忽略的中段。
- id: m10-c3
  front: 上下文截断的正确做法是什么？为什么不能从块中间截？
  back: 按（rerank 分数 × 时效）从低到高整块丢弃；绝不从块中间截断，否则破坏引用锚点完整性。丢弃后必须重编号引用，并保留 `chunk_id ↔ 引用编号` 映射表，供生成后校验回溯原文。
- id: m10-c4
  front: 拒答判据应该按什么顺序判定？
  back: 先严后宽，命中即拒：①检索为空或 top-1 相似度 < τ₁ ②rerank 后最高分 < τ₂（τ₂ > τ₁）③证据与问题主题不一致（意图越界）④证据间关键事实冲突且无法判定。阈值必须由黄金集标定，不能拍脑袋。
- id: m10-c5
  front: 为什么拒答必须同时测「漏拒率」和「误拒率」？
  back: 漏拒率=该拒没拒（编答案，代价高）；误拒率=不该拒却拒（用户流失，代价也高）。只调一个方向必然翻车：阈值调高降漏拒却抬误拒。两个数都进黄金集回归，阈值才不是魔法数字。
- id: m10-c6
  front: 会话记忆应保留什么、丢弃什么？
  back: 保留当前轮证据集与引用映射、上一轮最终答案的一两句摘要、会话级过滤条件；丢弃历史轮原始块、中间推理与检索日志、闲聊。指代消解只需「上一轮摘要+当轮问题」；需要历史原文时重新检索比塞进上下文更便宜也更准。
- id: m10-c7
  front: 生成模型选型时，质量/延迟/显存三角怎么权衡？
  back: 三者不能同时最优。用黄金集在 2–3 个候选（如 7B/14B/32B 量化档）上各跑一遍，记录引用正确率、误拒率、P95 延迟、显存占用四列；先按 SLO 硬门槛淘汰，再在通过者里挑性价比。成本估算要把检索与 rerank 也算进去。
- id: m10-c8
  front: 为什么说「引用约束反过来能抑制幻觉」？
  back: 提示词要求「每条结论必须带 [[n]]」，模型会自然收敛到「只写证据支持的话」——因为写不出引用的句子会被格式约束排除。但引用真实性不能靠模型自觉，仍必须落到生成后代码校验。
