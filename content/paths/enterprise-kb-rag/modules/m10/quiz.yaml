- id: m10-q1
  q: 生成阶段的核心任务是什么？为什么说「提示词管生成期、代码管生成后」两者缺一不可？
  a: 核心任务是三件事——只依据证据、每条结论可溯源、证据不足时拒答。提示词在生成期把约束写进去（限定知识边界、强制 `[[n]]`、要求拒答），能抑制幻觉；但模型是否真的遵守，必须靠代码在生成后校验（引用编号是否存在、引用是否支持结论）。只靠提示词，模型会「无视约束硬编」；只靠代码，生成期没有约束会产出大量无法修复的文本。
- id: m10-q2
  q: 设计上下文长度预算与截断策略时，有哪些硬性要求？
  a: ①先算总量再分配：可用预算 = 上下文窗口 − 系统提示 − 问题 − 输出预留（≥1k tokens）− 安全余量，逐块扣减；②整块丢弃、绝不从块中间截断（会破坏引用锚点）；③丢弃后重编号引用，保证 `[[n]]` 与最终证据集一致；④全程保留 chunk_id ↔ 引用编号映射表，供生成后校验回溯。顺序上还要把最关键证据放在开头/结尾以规避中段忽略。
- id: m10-q3
  q: 「证据不足即拒答」怎么实现，并且怎么证明它有效？
  a: 实现成可配置、可审计的判据链（命中即拒）：检索为空/top-1 相似度低于阈值、rerank 最高分过低、意图越界、证据冲突无法判定。有效性靠两组指标证明——漏拒率（该拒没拒）与误拒率（不该拒却拒），两者都要在黄金集上测出数字，并画出「阈值 vs 两类错误」曲线来选阈值，而不是拍脑袋定一个魔法数字。
- id: m10-q4
  q: 会话记忆为什么不能用「无限上下文」来解决？最小必要记忆保留什么？
  a: 无限上下文会让成本线性上涨、延迟上升、跑题概率增大，是把工程问题推给模型窗口的偷懒做法。最小必要记忆只保留：当前轮证据集与引用映射、上一轮答案的一两句摘要、会话级过滤条件（如「只看本部门」）；丢弃历史轮原始块、中间推理与闲聊。指代消解用「上一轮摘要+当轮问题」足够；确实需要历史原文时重新检索一次更便宜也更准。
