id: enterprise-kb-rag
title: 企业级知识库实战 · 大模型 RAG 路线 · 20 个里程碑
subtitle: 项目实践类 · 自建开源栈（vLLM + 向量库）· 从立项到上线与运营
audience: 要独立把一个企业知识库项目从 0 做到上线的工程师 / 技术负责人
description: >-
  与另外两条「岗位类」路径不同，这条是「项目实践类」：按项目里程碑推进，每个里程碑
  都有明确交付物与验收标准。七个阶段：① 立项与知识建模 ② 数据与索引 ③ 检索质量
  ④ 生成与可信引用 ⑤ 评测体系 ⑥ 平台化（多租户/权限/审计） ⑦ 上线与运营。
  技术栈以自建开源为主（vLLM 推理 + Qdrant/Milvus 向量库 + 自写编排 + 开源评测），
  关键处给托管方案对照。重点不是跑通 demo，而是企业级真正难的部分：删除与权限的
  传播、可信引用、可复现的评测、以及质量-成本-延迟三角的日常运营。
# 项目实践类：学习单元叫「里程碑」，界面上不显示成「Day」
unit: 里程碑
version: 0.1.0
