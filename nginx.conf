server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  # 安全响应头。
  # 注意 nginx 的坑：location 里出现 add_header 会「清空」server 级继承的同名头，
  # 所以下面 /assets/ 段把安全头又完整声明了一遍。
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
  # 纯静态、无后端、无外部资源，因此收紧到 self：
  #   script-src 'self'      —— 首屏主题脚本已外置为 /theme-init.js，页面里没有内联脚本
  #   style-src 'unsafe-inline' —— 组件用了内联 style 属性（React style={{}}），必须放行
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;

  # SPA fallback（当前是 hash 导航，配上以备未来上路由）
  location / {
    try_files $uri $uri/ /index.html;
  }

  # 内容哈希资源：长缓存 + 重复安全头
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'; object-src 'none'" always;
  }
}
