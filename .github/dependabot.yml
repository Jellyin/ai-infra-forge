version: 2

updates:
  # workflow 里的 action 固定到了 commit SHA，靠它跟进新版本
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "ci"
    labels:
      - dependencies

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
    # 内容/学习核心对 typescript 这类大版本升级敏感，先只自动提 minor/patch
    ignore:
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    labels:
      - dependencies
