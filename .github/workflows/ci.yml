name: CI

on:
  push:
    branches: [main]
  pull_request:

# 显式声明最小权限：PR 触发的 workflow 拿不到多余的作用域
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # action 固定到完整 commit SHA（升级交给 dependabot），避免可变标签被重指向后
      # 在 push:main / PR 里执行任意代码。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由 package.json 的 packageManager 字段唯一声明（CI 里不再重复 version）

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck（全包严格模式）
        run: pnpm -r run typecheck

      - name: Test（学习核心单测）
        run: pnpm -r run test

      - name: Content 校验（zod）
        run: pnpm run validate:content

      - name: Build（生产构建）
        run: pnpm --filter web run build

      - name: Playwright 冒烟（E2E）
        working-directory: apps/web
        run: pnpm exec playwright install chromium --with-deps && pnpm exec playwright test

      - name: 上传测试失败报告（仅失败时）
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7

      - name: 上传构建产物（便于检查）
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: apps/web/dist
          retention-days: 7
