name: Deploy Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 权限最小化：构建只需要读代码；能换取 Pages 部署令牌的 id-token:write
# 只留给真正需要它的 deploy job（build job 拿到它等于放大供应链攻击面）。
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # 所有 action 固定到完整 commit SHA（标签可被强制重指向 / 仓库可被攻陷，
      # 而 deploy job 持有发布权限，供应链投毒可直接篡改对全体访客的站点）。
      # 升级用 dependabot（见 .github/dependabot.yml），不改回可变标签。
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由 package.json 的 packageManager 唯一声明

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm --filter web run build

      # SPA 用 hash 路由（#/flashcards），无需 fallback 重写——index.html 直发即可
      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
